<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detective</title>
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#23305a;--sub:#5b6794;--line:#dcd2b0;--ok:#1f9d6b;--okbg:#d6f5e6;--c1:#ff7a59;--c2:#3b82f6}

:root[data-theme="dark"]{--bg:#171c33;--card:#232a4a;--ink:#f3f1ff;--sub:#aab2da;--line:#3a4370;--okbg:#17432f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.35}
main{max-width:560px;margin:0 auto;padding:14px 14px 30px}
button{font:inherit;color:inherit}
.btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.on{background:var(--c2);color:#fff;border-color:var(--c2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
[hidden]{display:none!important}

h1{font-size:1.6rem;margin:4px 0}
.sc{background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px}
.sc svg{display:block;width:100%;height:auto;touch-action:manipulation}
.sc.s{animation:sh .4s}
.lb{font-size:.85rem;font-weight:700;color:var(--sub);margin:2px 4px}
.st{font-weight:700;font-size:1.1rem}
.win{text-align:center;background:var(--okbg);border:2px solid var(--ok);border-radius:18px;padding:12px;margin-top:10px}
.pop{position:fixed;font-size:1.8rem;pointer-events:none;animation:fl 1.2s ease-out forwards}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fl{from{opacity:1}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.sc.s,.pop{animation:none}}
</style></head><body><main>
<h1>🔍 Detective de diferencias</h1>
<div class="row"><span class="st" id="st"></span></div>
<div class="lb">DIBUJO 1</div><div class="sc" id="a"></div>
<div class="lb">DIBUJO 2 · toca aquí o arriba las diferencias</div><div class="sc" id="b"></div>
<div class="row"><button class="btn" id="hint">💡 Pista</button><button class="btn" id="nw">🔄 Otro dibujo</button></div>
<div class="win" id="win" hidden></div>
</main><script>
var $=function(i){return document.getElementById(i)},R=function(n){return Math.floor(Math.random()*n)},shuf=function(a){return a.map(function(x){return[Math.random(),x]}).sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]})};

(v.cloud?'<g fill="#fff"><circle cx="52" cy="14" r="5"/><circle cx="58" cy="12" r="6"/><circle cx="64" cy="15" r="5"/></g>':'')+
(v.bird?'<path d="M18 12 q3 -4 6 0 q3 -4 6 0" stroke="#333" fill="none" stroke-width="1"/>':'')+

(v.cross?'<path d="M41.5 35 v7 M38 38.5 h7" stroke="#333" stroke-width=".6"/>':'')+

'<rect x="55" y="58" width="1" height="6" fill="#2e7d32"/><circle cx="55.5" cy="57" r="2.6" fill="'+v.flower+'"/>'+

function round(){var A={roof:D[0].a,door:D[1].a,cloud:1,bird:1,cross:1,apple:1,flower:D[6].a,sun:D[7].a};vB=Object.assign({},A);vA=A;
 N=window._LV===0?Math.min(2+lv,4):Math.min((window.NIVEL>=5?5:window.NIVEL>=3?4:3)+lv,window.NIVEL===1?5:8);pick=shuf(D).slice(0,N);pick.forEach(function(d){vB[d.k]=d.b||0});
 base=WALL[R(4)];found=[];mist=0;$("win").hidden=true;draw()}

 if(h){found.push(h);beep(780,.15);draw();if(found.length===N)win()}

$("hint").onclick=function(){var r=pick.filter(function(d){return found.indexOf(d)<0})[0];if(!r)return;var m=found.concat([r]);$("b").innerHTML=svg(vB,m);setTimeout(draw,1200)};
$("nw").onclick=round;
round();
</script></body></html>
