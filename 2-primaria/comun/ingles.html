<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest</title>
<style>
:root{--bg:#eef2ff;--card:#fff;--ink:#23305a;--sub:#5b6794;--line:#d3daf5;--ok:#1f9d6b;--okbg:#d6f5e6;--bad:#d9443b;--badbg:#fde0dd;--c1:#ff7a59;--c2:#3b82f6;--c4:#7c4dff;

:root[data-theme="dark"]{--bg:#171c33;--card:#232a4a;--ink:#f3f1ff;--sub:#aab2da;--line:#3a4370;--okbg:#17432f;--badbg:#4a2230;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.35;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:8px 0 4px}
.lead{margin:0 0 16px;color:var(--sub);font-size:1.1rem}
button{font:inherit;color:inherit}
.big{border:0;border-radius:20px;padding:18px;font-weight:700;font-size:1.3rem;color:#fff;background:linear-gradient(90deg,var(--c2),var(--c4));width:100%;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.info{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:18px 0;color:var(--sub)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;cursor:pointer}
.track{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .3s}
.mascot{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fox{font-size:3rem}
.fox.hop{animation:hop .5s}
.bubble{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:600}
.streak{font-weight:700;color:var(--c1);white-space:nowrap}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px 16px;text-align:center;font-size:1.45rem;font-weight:600;min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.spk{border:0;border-radius:50%;width:84px;height:84px;font-size:2.4rem;background:var(--c2);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:14px 8px;font-size:1.25rem;font-weight:600;cursor:pointer;min-height:62px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.line{min-height:64px;border:3px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;background:var(--card)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-weight:600;font-size:1.2rem;cursor:pointer}
.again{border:0;border-radius:18px;background:var(--c2);color:#fff;font-weight:700;font-size:1.2rem;padding:14px 26px;margin:6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.end{text-align:center;padding-top:20px}
.stars{font-size:2.6rem;letter-spacing:4px;margin:10px 0}
.pop{position:fixed;font-size:1.8rem;pointer-events:none;animation:fall 1.2s ease-out forwards;z-index:9}
.shake{animation:shake .4s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(8deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fall{from{opacity:1}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pop,.fox.hop,.shake{animation:none}}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
</style>
</head>

<section id="home">

  <div class="qcard" id="q"></div>
  <div class="opts" id="opts"></div>
</section>
<section id="end" class="end" hidden>
  <div class="stars" id="stars"></div>
  <h1 id="endtxt"></h1>
  <p class="lead" id="endsub"></p>
  <button class="again" id="again">Otra vez</button>
</section>
</main>
