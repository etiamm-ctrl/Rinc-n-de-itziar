<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detectives de diferencias</title>
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#23305a;--sub:#5b6794;--line:#dcd2b0;--ok:#1f9d6b;--okbg:#d6f5e6;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.35}
main{max-width:900px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:clamp(1.45rem,4vw,2rem);margin:4px 0 2px}
.intro{color:var(--sub);margin:0 0 14px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}
.stats{font-weight:700;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{min-width:0}
.label{font-size:.9rem;font-weight:800;color:var(--sub);margin:2px 4px 5px}
.scene{background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
button{font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;color:var(--ink);cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:white}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.win{margin-top:12px;text-align:center;background:var(--okbg);border:2px solid var(--ok);border-radius:16px;padding:12px;font-weight:700}
.win[hidden]{display:none}
.note{font-size:.9rem;color:var(--sub);margin-top:10px}
@media(max-width:600px){.boards{grid-template-columns:1fr}.scene{max-width:100%}.panel{width:100%}}
</style>
</head>
<body>
<main>
<h1>🔎 ¡Detectives de diferencias!</h1>
<p class="intro">Mira con atención los dos dibujos. Toca en el segundo dibujo cuando encuentres algo diferente.</p>
<div class="top">
  <div class="stats" id="stats" aria-live="polite">Diferencias: 0 de 6 · Intentos: 0</div>
  <div class="stats" id="level">Nivel 1</div>
</div>
<div class="boards">
  <section class="panel"><div class="label">DIBUJO 1</div><div class="scene" id="sceneA"></div></section>
  <section class="panel"><div class="label">DIBUJO 2 · ¡Encuentra los cambios!</div><div class="scene" id="sceneB"></div></section>
</div>
<div class="actions">
  <button id="hint">💡 Dame una pista</button>
  <button class="primary" id="next">🔄 Otro dibujo</button>
</div>
<div class="win" id="win" hidden></div>
<p class="note">Consejo: observa los colores, cuenta los objetos y fíjate en hacia dónde miran.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const scenes=[
 {name:"El parque",sky:"#a8e0ff",ground:"#8bd17c",decor:"park",items:[
  ["🌳",48,154,"🌲"],["🌷",100,196,"🌻"],["🦋",145,75,"🐝"],["☁️",275,52,"🌤️"],["🪁",330,95,"🎈"],["🐦",225,120,"🦉"],["⚽",185,205,"🏀"],["🌼",300,204,"🌹"],["🪑",70,220,"🛝"],["🍎",365,170,"🍐"]]},
 {name:"La playa",sky:"#8edcff",ground:"#ffe29a",decor:"beach",items:[
  ["☀️",340,48,"🌞"],["🏖️",80,165,"⛱️"],["🦀",145,218,"🐚"],["🐠",250,170,"🐡"],["⛵",205,82,"🚤"],["🩴",320,220,"👡"],["🦆",45,80,"🦢"],["🍉",370,130,"🍍"],["🏐",180,220,"⚽"],["🐬",280,95,"🐳"]]},
 {name:"La clase",sky:"#f8e7b8",ground:"#d8e9ff",decor:"class",items:[
  ["📚",65,190,"📕"],["✏️",130,210,"🖍️"],["🎒",205,190,"👜"],["🕒",340,65,"⏰"],["🪟",75,75,"🚪"],["🌍",275,180,"🏀"],["🧸",350,210,"🐻"],["📏",150,145,"✂️"],["🍎",235,85,"🍐"],["🖍️",25,220,"🖊️"]]},
 {name:"El espacio",sky:"#20285d",ground:"#303b78",decor:"space",items:[
  ["🚀",90,140,"🛸"],["🌙",330,55,"🪐"],["⭐",180,60,"🌟"],["👽",250,175,"🤖"],["🛰️",345,170,"🚁"],["☄️",145,220,"💫"],["🌎",55,55,"🌕"],["⭐",210,220,"✨"],["🪨",300,225,"💎"],["👾",130,95,"👻"]]},
 {name:"La granja",sky:"#bde8ff",ground:"#9ed47c",decor:"farm",items:[
  ["🐮",80,175,"🐷"],["🐔",170,205,"🦆"],["🐑",265,175,"🐐"],["🚜",340,210,"🚚"],["🌻",45,65,"🌷"],["🥕",145,145,"🌽"],["🐴",220,90,"🦄"],["🍎",320,90,"🍏"],["🪣",105,235,"🧺"],["🦋",370,145,"🐝"]]},
 {name:"La ciudad",sky:"#b7e5ff",ground:"#c6cbd5",decor:"city",items:[
  ["🚕",65,210,"🚙"],["🚦",135,145,"🚥"],["🏢",210,120,"🏬"],["🚲",310,210,"🛴"],["🐕",365,210,"🐈"],["🌳",45,100,"🌴"],["☂️",165,65,"🌂"],["🚌",270,235,"🚎"],["🪧",350,100,"🚏"],["🛴",115,235,"🛹"]]}
];
let level=1,roundNo=0,chosen=[],found=[],mistakes=0,current;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function background(s){
 let extra="";
 if(s.decor==="park") extra='<path d="M0 175 Q90 150 180 178 T400 170 V260 H0Z" fill="#72c66c"/><path d="M0 230 Q130 210 250 235 T400 220" stroke="#e6f5a2" stroke-width="5" fill="none"/>';
 if(s.decor==="beach") extra='<path d="M0 165 Q100 145 200 170 T400 160" fill="#42c7df"/><path d="M0 178 Q120 160 240 182 T400 174" stroke="white" stroke-width="5" fill="none"/>';
 if(s.decor==="class") extra='<rect x="18" y="20" width="364" height="220" rx="12" fill="#fff8dc" stroke="#b58a5a" stroke-width="5"/><rect x="110" y="35" width="180" height="92" rx="5" fill="#69b879" stroke="#8b6545" stroke-width="5"/><path d="M200 35V127 M110 81H290" stroke="#fff" stroke-width="4"/>';
 if(s.decor==="space") extra='<circle cx="70" cy="110" r="2" fill="white"/><circle cx="300" cy="100" r="3" fill="white"/><circle cx="220" cy="35" r="2" fill="white"/><circle cx="370" cy="60" r="2" fill="white"/><circle cx="25" cy="220" r="3" fill="white"/>';
 if(s.decor==="farm") extra='<path d="M0 150 L70 90 L140 150 L210 80 L290 150 L350 95 L400 150" fill="#78b96d"/><rect x="275" y="95" width="85" height="65" fill="#e8a05e"/><path d="M265 98 L318 55 L370 98Z" fill="#c85d45"/>';
 if(s.decor==="city") extra='<rect x="15" y="65" width="85" height="120" fill="#e9a66c"/><rect x="110" y="35" width="95" height="150" fill="#8b9ac7"/><rect x="220" y="75" width="75" height="110" fill="#e5c66d"/><g fill="#fff3b0"><rect x="30" y="82" width="15" height="18"/><rect x="65" y="82" width="15" height="18"/><rect x="130" y="55" width="18" height="20"/><rect x="165" y="55" width="18" height="20"/></g>';
 return `<rect width="400" height="260" fill="${s.sky}"/><rect y="155" width="400" height="105" fill="${s.ground}"/>${extra}`;
}
function svg(which,mark=[]){
 const s=current.scene, items=s.items.map((it,i)=>{
  const [emoji,x,y,alt]=it, isDiff=chosen.includes(i), changed=which==="B"&&isDiff;
  let e=changed?alt:emoji,scale=1,rot=0,dx=0,dy=0;
  if(changed){const kind=current.types[chosen.indexOf(i)];if(kind===1)scale=.72;if(kind===2)rot=35;if(kind===3)dx=13;if(kind===4)dy=-13;if(kind===5)scale=1.28;}
  const circle=mark.includes(i)?`<circle cx="${x+dx}" cy="${y+dy}" r="22" fill="none" stroke="#159b68" stroke-width="3"/>`:"";
  return `${circle}<text x="${x+dx}" y="${y+dy}" text-anchor="middle" dominant-baseline="central" font-size="31" transform="rotate(${rot} ${x+dx} ${y+dy}) scale(${scale})">${e}</text>`;
 }).join("");
 return `<svg viewBox="0 0 400 260" role="img" aria-label="${s.name}">${background(s)}${items}</svg>`;
}
function update(){
 $("sceneA").innerHTML=svg("A",found);$("sceneB").innerHTML=svg("B",found);
 $("stats").textContent=`Diferencias: ${found.length} de ${chosen.length} · Intentos: ${mistakes}`;
 $("level").textContent=`Nivel ${level} · ${current.scene.name}`;
 $("sceneB").querySelector("svg").addEventListener("click",tap);
}
function newRound(){
 roundNo++;current={scene:scenes[(roundNo-1)%scenes.length],types:[]};
 let count=Math.min(5+Math.floor((level-1)/2),8);
 chosen=shuffle(current.scene.items.map((_,i)=>i)).slice(0,count);
 current.types=chosen.map(()=>Math.floor(Math.random()*6));
 found=[];mistakes=0;$("win").hidden=true;update();
}
function tap(ev){
 if(!$("win").hidden)return;
 const r=ev.currentTarget.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*400,y=(ev.clientY-r.top)/r.height*260;
 const hit=chosen.find(i=>!found.includes(i)&&Math.hypot(current.scene.items[i][1]-x,current.scene.items[i][2]-y)<27);
 if(hit!==undefined){found.push(hit);update();if(found.length===chosen.length)finish();}
 else{mistakes++;$("stats").textContent=`Diferencias: ${found.length} de ${chosen.length} · Intentos: ${mistakes}`;}
}
function finish(){
 $("win").hidden=false;
 const stars=mistakes<=2?"⭐⭐⭐":mistakes<=5?"⭐⭐":"⭐";
 $("win").innerHTML=`<div style="font-size:2rem">${stars}</div>¡Trabajo de detective! Has encontrado todas las diferencias. <br><button class="primary" id="again" style="margin-top:10px">Siguiente reto ➜</button>`;
 $("again").onclick=()=>{level++;newRound();};
}
$("hint").onclick=()=>{
 const left=chosen.filter(i=>!found.includes(i));if(!left.length)return;
 const target=left[0];$("sceneB").innerHTML=svg("B",[...found,target]);
 setTimeout(()=>{if($("win").hidden)update();},1000);
};
$("next").onclick=newRound;
newRound();
</script>
</body>
</html>
