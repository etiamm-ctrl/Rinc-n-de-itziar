<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pintar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#23305a;--sub:#5b6794;--line:#dcd2b0;--c1:#ff7a59;--c2:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c33;--card:#232a4a;--ink:#f3f1ff;--sub:#aab2da;--line:#3a4370;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c33;--card:#232a4a;--ink:#f3f1ff;--sub:#aab2da;--line:#3a4370;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.3}
main{max-width:600px;margin:0 auto;padding:10px 14px 30px}
h1{margin:0 0 8px;font-size:34px;text-align:center;letter-spacing:1px}
button{font:inherit;color:inherit}
.btn{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px 13px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.92)}
.btn.on{background:var(--c2);color:#fff;border-color:var(--c2)}
#mc.on{background:var(--c1);border-color:var(--c1)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:10px}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
[hidden]{display:none!important}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;font-size:20px;line-height:1}
.sw.on{border-color:var(--ink);transform:scale(1.18)}
.st{font-size:26px;padding:4px 9px}
#cv{width:100%;height:50vh;min-height:260px;touch-action:none;background:#fff;border:4px solid var(--line);border-radius:22px;display:block}
#pic{background:#fff;border:4px solid var(--line);border-radius:22px;padding:6px}
#pic svg{width:100%;height:50vh;min-height:260px;display:block}
.r{cursor:pointer}
.cf{position:fixed;pointer-events:none;font-size:24px;z-index:9;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(220deg);opacity:0}}
#ms{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--c1);color:#fff;font-weight:700;font-size:22px;padding:10px 22px;border-radius:30px;z-index:10;pointer-events:none;animation:up .35s ease-out}
@keyframes up{from{transform:translate(-50%,30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cf{display:none}#ms{animation:none}}
</style></head><body><main>
<h1 aria-label="Pintar"><span style="color:#e53935">P</span><span style="color:#fb8c00">i</span><span style="color:#43a047">n</span><span style="color:#1e88e5">t</span><span style="color:#8e24aa">a</span><span style="color:#ec407a">r</span> 🎨</h1>
<div class="row"><button class="btn on" id="mf">✏️ Dibujar</button><button class="btn" id="mc">🖍️ Colorear</button><button class="btn" id="sn" aria-label="Sonido">🔊</button></div>
<div class="row" id="pal"></div>
<div id="free">
<div class="row"><button class="btn on" data-b="l">✏️ Lápiz</button><button class="btn" data-b="g">✨ Purpurina</button><button class="btn" data-b="s">🦄 Sellos</button><button class="btn" data-b="e">🧽 Goma</button></div>
<div class="row"><button class="btn" data-s="4">Fino</button><button class="btn on" data-s="10">Medio</button><button class="btn" data-s="24">Grueso</button><button class="btn" id="sy">🪞 Espejo</button></div>
<div class="row" id="sts" hidden></div>
</div>
<div class="row" id="pics" hidden><button class="btn" id="np">➡️ Otro dibujo</button></div>
<canvas id="cv"></canvas><div id="pic" hidden></div>
<div class="row" style="margin-top:12px"><button class="btn" id="un">↩️ Deshacer</button><button class="btn" id="cl">🗑️ Borrar todo</button></div>
</main><div id="ms" hidden></div><script>
var $=function(i){return document.getElementById(i)},each=function(l,f){Array.prototype.forEach.call(l,f)};
var C=["#e53935","#fb8c00","#fdd835","#43a047","#1e88e5","#8e24aa","#f48fb1","#6d4c41","#212121","#ffffff","#80deea","#a5d6a7","r"],col=C[0],sz=10,br="l",mode="f",hist=[],cu=[],pi=0,dr=false,hue=0,st="⭐",snd=true,lp,sym=false,acc=0,n=0,ac,mt;
var cv=$("cv"),cx=cv.getContext("2d");
function fit(){var d=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);cx.fillStyle="#fff";cx.fillRect(0,0,r.width,r.height)}
fit();
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function beep(f){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.25)}catch(e){}}
function msg(t){var m=$("ms");m.textContent=t;m.hidden=false;m.style.animation="none";void m.offsetWidth;m.style.animation="";clearTimeout(mt);mt=setTimeout(function(){m.hidden=true},1600)}
var PR=["¡Qué bonito!","¡Increíble!","¡Eres una artista!","¡Guau, qué colores!","¡Mira qué bien!","¡Me encanta!"];
function pop(x,y){for(var i=0;i<7;i++){var s=document.createElement("span");s.className="cf";s.textContent=rnd(["⭐","✨","💖","🌈","🎈","🌸"]);s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.setProperty("--dy",(Math.random()*-140-20)+"px");document.body.appendChild(s);setTimeout(function(e){e.remove()},950,s)}}
function cc(){if(col==="r"){hue=(hue+9)%360;return"hsl("+hue+",90%,55%)"}return col}
C.forEach(function(c){var b=document.createElement("button");b.className="sw"+(c===col?" on":"");if(c==="r"){b.textContent="🌈";b.style.background="var(--card)";b.setAttribute("aria-label","arcoíris")}else{b.style.background=c;b.setAttribute("aria-label","color "+c)}b.onclick=function(){col=c;if(br==="e"&&mode==="f")setBr("l");each($("pal").children,function(x){x.classList.remove("on")});b.classList.add("on");beep(520)};$("pal").appendChild(b)});
["⭐","❤️","🦄","🌈","🐱","🌸","🦋","🍓","☀️","🐶"].forEach(function(e){var b=document.createElement("button");b.className="btn st";b.textContent=e;b.onclick=function(){st=e;each($("sts").children,function(x){x.classList.remove("on")});b.classList.add("on")};if(e===st)b.classList.add("on");$("sts").appendChild(b)});
function setBr(b){br=b;each($("free").querySelectorAll("[data-b]"),function(x){x.classList.toggle("on",x.dataset.b===b)});$("sts").hidden=b!=="s"}
each($("free").querySelectorAll("[data-b]"),function(b){b.onclick=function(){setBr(b.dataset.b);beep(440)}});
each($("free").querySelectorAll("[data-s]"),function(b){b.onclick=function(){sz=+b.dataset.s;each($("free").querySelectorAll("[data-s]"),function(x){x.classList.remove("on")});b.classList.add("on")}});
$("sy").onclick=function(){sym=!sym;$("sy").classList.toggle("on",sym)};
$("sn").onclick=function(){snd=!snd;$("sn").textContent=snd?"🔊":"🔇"};
function pt(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function seg(a,b,c){cx.strokeStyle=c;cx.lineWidth=br==="e"?sz*2:sz;cx.lineCap=cx.lineJoin="round";cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();if(br==="g"){for(var i=0;i<3;i++){cx.fillStyle=rnd(["#ffca28","#ec407a","#29b6f6","#ab47bc","#66bb6a","#ff7043"]);cx.beginPath();cx.arc(b[0]+(Math.random()-.5)*sz*3,b[1]+(Math.random()-.5)*sz*3,Math.random()*sz/3+1.5,0,6.3);cx.fill()}}}
function both(a,b){var W=cv.getBoundingClientRect().width,c=br==="e"?"#fff":cc();for(var m=0;m<2;m++){if(m&&!sym)break;seg(m?[W-a[0],a[1]]:a,m?[W-b[0],b[1]]:b,c)}}
function stamp(p){var W=cv.getBoundingClientRect().width;cx.font=(20+sz*3.3)+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(st,p[0],p[1]);if(sym)cx.fillText(st,W-p[0],p[1]);beep(660)}
cv.onpointerdown=function(e){cv.setPointerCapture(e.pointerId);hist.push(cx.getImageData(0,0,cv.width,cv.height));if(hist.length>15)hist.shift();dr=true;lp=pt(e);acc=0;if(br==="s")stamp(lp);else both(lp,[lp[0]+.01,lp[1]])};
cv.onpointermove=function(e){if(!dr)return;var p=pt(e);if(br==="s"){acc+=Math.hypot(p[0]-lp[0],p[1]-lp[1]);if(acc>sz*3+40){stamp(p);acc=0}}else both(lp,p);lp=p};
cv.onpointerup=cv.onpointercancel=function(e){if(!dr)return;dr=false;if(++n%6===0){msg(rnd(PR));pop(e.clientX,e.clientY);beep(784)}};
var P=['<rect class="r" x="0" y="0" width="100" height="80"/><circle class="r" cx="84" cy="14" r="8"/><rect class="r" x="0" y="60" width="100" height="20"/><rect class="r" x="22" y="34" width="40" height="28"/><polygon class="r" points="18,34 42,14 66,34"/><rect class="r" x="38" y="46" width="9" height="16"/><rect class="r" x="26" y="40" width="9" height="8"/><rect class="r" x="52" y="40" width="7" height="8"/><rect class="r" x="80" y="42" width="5" height="20"/><circle class="r" cx="82.5" cy="36" r="11"/>',
'<rect class="r" x="0" y="0" width="100" height="80"/><rect class="r" x="0" y="66" width="100" height="14"/><ellipse class="r" cx="46" cy="38" rx="26" ry="16"/><polygon class="r" points="70,38 90,24 90,52"/><polygon class="r" points="38,24 50,10 56,26"/><circle class="r" cx="32" cy="34" r="3"/><circle class="r" cx="14" cy="18" r="4"/><circle class="r" cx="22" cy="8" r="2.5"/><path class="r" d="M70 66 q4 -14 8 0z"/>',
'<rect class="r" x="0" y="0" width="100" height="80"/><rect class="r" x="0" y="62" width="100" height="18"/><rect class="r" x="48" y="36" width="4" height="28"/><ellipse class="r" cx="38" cy="54" rx="9" ry="4"/><ellipse class="r" cx="62" cy="48" rx="9" ry="4"/><circle class="r" cx="50" cy="14" r="8"/><circle class="r" cx="62" cy="23" r="8"/><circle class="r" cx="58" cy="37" r="8"/><circle class="r" cx="42" cy="37" r="8"/><circle class="r" cx="38" cy="23" r="8"/><circle class="r" cx="50" cy="26" r="7"/>',
'<rect class="r" x="0" y="0" width="100" height="80"/><ellipse class="r" cx="34" cy="30" rx="18" ry="14"/><ellipse class="r" cx="66" cy="30" rx="18" ry="14"/><ellipse class="r" cx="37" cy="52" rx="13" ry="10"/><ellipse class="r" cx="63" cy="52" rx="13" ry="10"/><circle class="r" cx="30" cy="30" r="5"/><circle class="r" cx="70" cy="30" r="5"/><ellipse class="r" cx="50" cy="42" rx="4" ry="20"/><path d="M48 24 Q44 10 38 8M52 24 Q56 10 62 8" fill="none"/>',
'<rect class="r" x="0" y="0" width="100" height="80"/><circle class="r" cx="50" cy="64" r="46"/><circle class="r" cx="50" cy="64" r="38"/><circle class="r" cx="50" cy="64" r="30"/><circle class="r" cx="50" cy="64" r="22"/><rect class="r" x="0" y="64" width="100" height="16"/><circle class="r" cx="14" cy="60" r="7"/><circle class="r" cx="24" cy="57" r="9"/><circle class="r" cx="34" cy="60" r="7"/><circle class="r" cx="88" cy="14" r="8"/>'];
function showPic(){$("pic").innerHTML='<svg viewBox="0 0 100 80"><g stroke="#333" stroke-width=".8" fill="#fff">'+P[pi]+'</g></svg>';cu=[]}
$("pic").onclick=function(e){var t=e.target;if(t.classList&&t.classList.contains("r")){var f=col==="r"?"hsl("+Math.floor(Math.random()*360)+",85%,60%)":col;cu.push([t,t.getAttribute("fill")]);t.setAttribute("fill",f);beep(500+Math.random()*400);pop(e.clientX,e.clientY);if(++n%4===0)msg(rnd(PR))}};
$("np").onclick=function(){pi=(pi+1)%P.length;showPic();beep(600)};
function setMode(m){mode=m;$("mf").classList.toggle("on",m==="f");$("mc").classList.toggle("on",m==="c");cv.hidden=m!=="f";$("free").hidden=m!=="f";$("pic").hidden=m!=="c";$("pics").hidden=m!=="c";if(m==="c")showPic()}
$("mf").onclick=function(){setMode("f")};$("mc").onclick=function(){setMode("c")};
$("un").onclick=function(){if(mode==="f"){var h=hist.pop();if(h)cx.putImageData(h,0,0)}else{var u=cu.pop();if(u){if(u[1])u[0].setAttribute("fill",u[1]);else u[0].removeAttribute("fill")}}};
$("cl").onclick=function(){if(mode==="f"){hist.push(cx.getImageData(0,0,cv.width,cv.height));cx.save();cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.restore()}else showPic()};
</script></body></html>
