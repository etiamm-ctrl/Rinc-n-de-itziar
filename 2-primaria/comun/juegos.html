<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprende jugando</title>
<style>
:root{--bg:#fff6e0;--card:#ffffff;--ink:#23305a;--sub:#5b6794;--line:#e4d9b8;--ok:#1f9d6b;--okbg:#d6f5e6;--bad:#d9443b;--badbg:#fde0dd;--c1:#ff7a59;--c2:#3b82f6;--c3:#22b07d;--c4:#a855f7;--c5:#f5b301;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c33;--card:#232a4a;--ink:#f3f1ff;--sub:#aab2da;--line:#3a4370;--okbg:#17432f;--badbg:#4a2230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c33;--card:#232a4a;--ink:#f3f1ff;--sub:#aab2da;--line:#3a4370;--okbg:#17432f;--badbg:#4a2230;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.35;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:8px 0 4px;font-weight:700}
p.lead{margin:0 0 20px;color:var(--sub);font-size:1.1rem}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border:0;border-radius:20px;padding:18px 12px;font:inherit;font-weight:700;font-size:1.15rem;color:#fff;cursor:pointer;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.cat span{display:block;font-size:2.2rem;margin-bottom:4px}
.cat:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.cat.all{grid-column:1/-1;background:linear-gradient(90deg,var(--c1),var(--c4))}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;padding:6px 12px;cursor:pointer}
.track{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:var(--c3);transition:width .3s}
.score{font-weight:700}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 18px;text-align:center;font-size:1.5rem;font-weight:600;min-height:120px;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:16px 8px;font:inherit;font-size:1.3rem;font-weight:600;cursor:pointer;min-height:64px}
.opt:focus-visible,.cat:focus-visible,.back:focus-visible,.again:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{text-align:center;font-size:1.4rem;font-weight:700;min-height:2.2rem;margin-top:14px}
.end{text-align:center;padding-top:20px}
.stars{font-size:2.6rem;letter-spacing:4px;margin:10px 0}
.big{font-size:1.6rem;font-weight:700}
.again{border:0;border-radius:18px;background:var(--c2);color:#fff;font:inherit;font-weight:700;font-size:1.2rem;padding:14px 26px;margin:6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.again.alt{background:var(--c1)}
.mascot{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fox{font-size:3rem}
.fox.hop{animation:hop .5s}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:600;flex:1}
.streak{font-weight:700;color:var(--c1);white-space:nowrap}
.shake{animation:shake .4s}
.pop{position:fixed;font-size:1.8rem;pointer-events:none;animation:fall 1.2s ease-out forwards;z-index:9}
.album{margin-top:22px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.album b{display:block;margin-bottom:6px}
.stk{font-size:1.8rem;margin:2px}
.ord{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.ordout{min-height:56px;display:flex;gap:8px;justify-content:center;align-items:center;font-size:1.6rem;font-weight:700}
@keyframes hop{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(8deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fall{from{opacity:1;transform:translateY(0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(360deg)}}

.lvs .lv{display:block;width:100%;margin-bottom:10px;font-size:1.2rem;color:#1b2340}
.lv:disabled{opacity:.7;cursor:default}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{aspect-ratio:1;border:3px solid transparent;border-radius:16px;background:var(--c4);color:#fff;font:inherit;font-weight:700;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card.up{background:var(--card);color:var(--ink);border-color:var(--line);font-size:1.6rem}
.card.done{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{min-height:170px;border:3px dashed var(--line);border-radius:18px;padding:8px;text-align:center;font-weight:700;background:var(--card)}
.bin .chip{margin:4px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;min-height:60px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:inherit;font-weight:600;font-size:1.2rem;touch-action:none;cursor:grab;user-select:none}
.chip.sel{border-color:var(--c2);background:var(--okbg)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
</style>
</head>
<body>
<main>
<section id="home">

  <p class="lead">¡A jugar y aprender! Elige un tema.</p>
  <div class="menu" id="menu"></div>
  <p class="lead" style="margin-top:22px">Más juegos</p>
  <div class="menu" id="games"></div>
  <div class="album" id="album"></div>
</section>
<section id="quiz" hidden>
  <div class="bar">
    <button class="back" id="back">Salir</button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="score" id="score">0 ⭐</div>
  </div>
  <div class="mascot"><div class="fox" id="fox">🦊</div><div class="bubble" id="bub">¡Tú puedes!</div><div class="streak" id="combo"></div></div>
  <div class="qcard" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
</section>
<section id="map" hidden>
  <div class="bar"><button class="back" id="mapback">Volver</button></div>
  <h1>La aventura 🗺️</h1>
  <p class="lead">Acierta 4 de 5 para pasar de nivel.</p>
  <div class="lvs" id="lvs"></div>
</section>
<section id="mem" hidden>
  <div class="bar"><button class="back" id="memback">Salir</button><div class="score" id="mscore"></div></div>
  <p class="lead">Encuentra las parejas: dibujo y palabra en inglés.</p>
  <div class="grid" id="grid"></div>
</section>
<section id="dd" hidden>
  <div class="bar"><button class="back" id="ddback">Salir</button><div class="score" id="dscore"></div></div>
  <p class="lead" id="dtitle"></p>
  <div class="bins" id="bins"></div>
  <div class="chips" id="chips"></div>
</section>
<section id="end" class="end" hidden>
  <div class="stars" id="stars"></div>
  <div class="big" id="endtxt"></div>
  <p class="lead" id="endsub"></p>
  <button class="again" id="repeat">Otra vez</button>
  <button class="again alt" id="menu2">Elegir tema</button>
</section>
</main>
