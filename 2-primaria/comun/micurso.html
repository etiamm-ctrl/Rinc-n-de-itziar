{id:"m06",t:2,n:"La multiplicación",e:"✖️",g:"m-mul",learn:["Multiplicar es sumar varias veces el mismo número.","3 + 3 + 3 + 3 es lo mismo que 4 × 3: «4 veces 3».","El signo × se lee «por».","El orden no cambia el resultado: 4 × 3 = 3 × 4 = 12."],

    P(function(){var k=R(4)+2,n=R(5)+2,s=[],i;for(i=0;i<k;i++)s.push(n);return Q(s.join(" + ")+" es lo mismo que…",k+" × "+n,[n+" + "+k,(k+1)+" × "+n,k+" × "+(n+1)])},function(){var k=R(4)+2,n=R(5)+2;return N(k+" veces "+n+" son…",k*n,1)}),
    P(function(){var k=R(4)+2,n=R(5)+2;return N("En una mesa hay "+k+" platos con "+n+" galletas en cada plato. ¿Cuántas galletas hay?",k*n,1)},function(){var k=R(5)+2,n=R(4)+2;return N("Compro "+k+" bolsas con "+n+" caramelos cada una. ¿Cuántos caramelos tengo?",k*n,1)},function(){var k=R(4)+3;return N("Un perro tiene 4 patas. ¿Cuántas patas tienen "+k+" perros?",k*4,1)})]},
{id:"m07",t:2,n:"Las tablas del 2, del 5 y del 10",e:"🔟",g:"m-mul",learn:["La tabla del 2 es contar de 2 en 2: 2, 4, 6, 8…","La tabla del 10 es contar de 10 en 10: termina siempre en 0.","La tabla del 5 termina siempre en 0 o en 5.","Truco: el doble de un número es multiplicarlo por 2."],

{id:"m08",t:2,n:"Las tablas del 3 y del 4",e:"🔢",g:"m-mul",learn:["La tabla del 3: 3, 6, 9, 12, 15, 18, 21, 24, 27, 30.","La tabla del 4: 4, 8, 12, 16, 20, 24, 28, 32, 36, 40.","Truco: multiplicar por 4 es hacer el doble del doble.","Las tablas se aprenden mejor recitándolas en voz alta."],

{id:"m09",t:2,n:"Las horas y el dinero",e:"🕒",g:"m-hor",learn:["La aguja corta marca las horas y la larga, los minutos.","«En punto»: la larga en el 12. «Y media»: la larga en el 6.","«Y cuarto»: la larga en el 3. «Menos cuarto»: la larga en el 9.","1 euro son 100 céntimos. Hay monedas de 1 y 2 € y billetes de 5, 10 y 20 €."],
 L:[function(){return hq([0,30])},
    P(function(){return hq([0,15,30,45])},function(){var a=R(3)+1,b=R(3)+1;return N("Tienes "+a+" moneda"+(a>1?"s":"")+" de 2 € y "+b+" de 1 €. ¿Cuántos euros tienes?",2*a+b)},function(){var b=[5,10,20][R(3)],c=R(3)+1;return N("Tienes un billete de "+b+" € y "+c+" moneda"+(c>1?"s":"")+" de 1 €. ¿Cuántos euros tienes?",b+c,1)}),

{id:"m10",t:3,n:"Las tablas del 6, 7, 8 y 9",e:"🧠",g:"m-mul",learn:["Tabla del 6: 6, 12, 18, 24, 30, 36, 42, 48, 54, 60.","Tabla del 7: 7, 14, 21, 28, 35, 42, 49, 56, 63, 70.","Tabla del 8: es el doble de la tabla del 4.","Tabla del 9: las cifras del resultado siempre suman 9 (18 → 1 + 8)."],

{id:"m11",t:3,n:"Medidas: longitud, peso y capacidad",e:"📏",g:"m-med",
 learn:["La longitud se mide en metros (m) y centímetros (cm): 1 m = 100 cm.","El peso se mide en kilos (kg): medio kilo es la mitad de 1 kg.","La capacidad (lo que cabe) se mide en litros (l).","Usamos la regla o el metro para medir, la balanza para pesar y la jarra para la capacidad."],
 L:[B([["¿Qué es más largo?","🚂 un tren",["✏️ un lápiz","🔑 una llave","🐜 una hormiga"]],["¿Qué pesa más?","🐘 un elefante",["🐭 un ratón","🪶 una pluma","🍎 una manzana"]],["¿Dónde cabe más agua?","🛁 en una bañera",["🥛 en un vaso","🥄 en una cuchara","🫖 en una tetera"]],["¿Qué es más corto?","🐜 una hormiga",["🦒 una jirafa","🚌 un autobús","🌳 un árbol"]],["¿Qué pesa menos?","🪶 una pluma",["🚗 un coche","🐄 una vaca","🪑 una silla"]],["¿Qué usamos para pesar?","⚖️ la balanza",["📏 la regla","⏰ el reloj","🥛 el vaso"]]]),
    B([["¿Con qué unidad medimos el largo de una clase?","el metro",["el litro","el kilo","la hora"]],["¿Con qué unidad medimos el agua de una botella?","el litro",["el metro","el kilo","el centímetro"]],["¿Con qué unidad medimos lo que pesa un saco de patatas?","el kilo",["el litro","el metro","el minuto"]],["¿Con qué unidad medimos un lápiz?","el centímetro",["el kilómetro","el litro","el kilo"]],["Medio litro es…","la mitad de un litro",["dos litros","un metro","diez litros"]],["Un cuarto de kilo es…","la cuarta parte de un kilo",["cuatro kilos","medio kilo","un litro"]]]),
    P(function(){var a=R(5)+1;return N(a+" metros son ___ centímetros",a*100,100)},function(){var a=R(4)+2;return N("¿Cuántos litros son "+a*2+" botellas de medio litro?",a,1)},B([["¿Qué es más: 1 metro o 80 centímetros?","1 metro",["80 centímetros","son iguales","no se sabe"]],["¿Qué es más: medio kilo o 1 kilo?","1 kilo",["medio kilo","son iguales","no se sabe"]],["Una botella grande tiene 2 litros. ¿Cuántos vasos de medio litro llena?","4",["2","6","1"]],["Un metro tiene…","100 centímetros",["10 centímetros","1.000 centímetros","50 centímetros"]]]))]},
{id:"m12",t:3,n:"Figuras y cuerpos geométricos",e:"🔷",g:"m-fig",
 learn:["Las figuras planas tienen lados y vértices (las esquinas).","El triángulo tiene 3 lados, el cuadrado y el rectángulo 4, el pentágono 5 y el hexágono 6.","El círculo no tiene lados ni vértices.","Los cuerpos geométricos ocupan espacio: cubo, esfera, cilindro, cono y pirámide."],
 L:[function(){var F=[["círculo",'<circle cx="50" cy="50" r="40"/>'],["cuadrado",'<rect x="14" y="14" width="72" height="72"/>'],["triángulo",'<polygon points="50,10 92,88 8,88"/>'],["rectángulo",'<rect x="6" y="26" width="88" height="48"/>'],["pentágono",'<polygon points="50,8 92,40 76,90 24,90 8,40"/>'],["hexágono",'<polygon points="28,12 72,12 94,50 72,88 28,88 6,50"/>']],k=R(F.length);return Q("figura "+F[k][0],F[k][0],F.map(function(x){return x[0]}),{h:'<div><svg viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="figura"><g fill="#3b82f6" fill-opacity=".3" stroke="currentColor" stroke-width="3">'+F[k][1]+'</g></svg><div style="font-size:1.15rem">¿Qué figura es?</div></div>'})},
    B([["¿Cuántos lados tiene un triángulo?","3",["4","5","6"]],["¿Cuántos vértices tiene un cuadrado?","4",["3","5","8"]],["¿Cuántos lados tiene un hexágono?","6",["5","8","4"]],["¿Cuántos lados tiene un pentágono?","5",["6","4","3"]],["¿Qué figura no tiene vértices?","el círculo",["el cuadrado","el triángulo","el rectángulo"]],["¿Qué figura tiene 4 lados iguales?","el cuadrado",["el rectángulo","el triángulo","el pentágono"]],["Una línea que no se tuerce es una línea…","recta",["curva","redonda","quebrada"]]]),
    B([["¿Qué forma tiene un balón?","🔵 esfera",["🎲 cubo","🥫 cilindro","🍦 cono"]],["¿Qué forma tiene un dado?","🎲 cubo",["🔵 esfera","🍦 cono","🥫 cilindro"]],["¿Qué forma tiene una lata de refresco?","🥫 cilindro",["🎲 cubo","🔵 esfera","🔺 pirámide"]],["¿Qué forma tiene un cucurucho de helado?","🍦 cono",["🥫 cilindro","🎲 cubo","🔵 esfera"]],["¿Cuántas caras tiene un cubo?","6",["4","8","12"]],["¿Qué cuerpo puede rodar en todas las direcciones?","la esfera",["el cubo","la pirámide","el prisma"]]])]},
{id:"m13",t:3,n:"Problemas de dos operaciones",e:"🧩",g:"m-pro",
 learn:["Lee el problema dos veces y busca qué te preguntan.","Fíjate en las palabras clave: «más», «en total» (sumar); «quedan», «faltan» (restar); «cada uno» (multiplicar o repartir).","Algunos problemas tienen dos pasos: primero una operación y luego otra.","Al final, comprueba si el resultado tiene sentido."],
 L:[function(){var a=R(30)+20,b=R(15)+5,s=R(2);return N(s?"Lucas tiene "+a+" canicas y le dan "+b+". ¿Cuántas tiene ahora?":"Lucas tiene "+a+" canicas y pierde "+b+". ¿Cuántas le quedan?",s?a+b:a-b,1)},
    P(function(){var k=R(4)+2,n=R(5)+2;return N("En cada caja hay "+n+" pasteles. ¿Cuántos pasteles hay en "+k+" cajas?",k*n,1)},function(){var k=[2,3,4,5][R(4)],n=R(5)+2;return N("Reparto "+k*n+" galletas entre "+k+" amigos por igual. ¿Cuántas recibe cada uno?",n,1)}),
    P(function(){var a=R(20)+20,b=R(10)+5,c=R(10)+5;return N("En un tren van "+a+" personas. En la parada bajan "+b+" y suben "+c+". ¿Cuántas van ahora?",a-b+c,1)},function(){var k=R(3)+2,n=R(4)+3,c=R(5)+1;return N("Compro "+k+" paquetes de "+n+" cromos y regalo "+c+". ¿Cuántos cromos me quedan?",k*n-c,1)},function(){var p=R(4)+2,q=R(3)+2;return N("Un helado cuesta "+p+" € y un zumo "+q+" €. Pago con un billete de 10 €. ¿Cuánto me devuelven?",10-p-q,1)})]}];

{id:"l03",t:1,n:"El sustantivo: común y propio",e:"🏷️",g:"l-pal",learn:["Los sustantivos (o nombres) son palabras que nombran personas, animales, cosas o lugares.","Los nombres comunes nombran cualquier cosa: perro, ciudad, río.","Los nombres propios nombran algo concreto y se escriben con mayúscula: Lola, Valencia, Turia.","Los nombres colectivos nombran un grupo: rebaño (de ovejas), bosque (de árboles)."],

{id:"l04",t:1,n:"Género y número",e:"👫",g:"l-gen",learn:["El género puede ser masculino (el niño) o femenino (la niña).","El número puede ser singular (uno: gato) o plural (varios: gatos).","Para formar el plural añadimos -s o -es: casa → casas, flor → flores.","Si la palabra acaba en z, cambia a c: lápiz → lápices, pez → peces."],

{id:"l05",t:2,n:"El adjetivo",e:"🎨",g:"l-pal",learn:["El adjetivo dice cómo es el sustantivo: grande, rojo, simpático.","Va junto al nombre: «el perro pequeño».","El adjetivo tiene el mismo género y número que el nombre: casa blanca, coches blancos.","Los adjetivos nos ayudan a describir."],
 L:[B([["¿Qué palabra dice cómo es algo?","alto",["mesa","correr","Ana"]],["¿Qué palabra dice cómo es algo?","suave",["gato","saltar","Luis"]],["¿Qué palabra dice cómo es algo?","redondo",["balón","jugar","mamá"]],["¿Cómo es el hielo?","frío",["caliente","dulce","rápido"]],["¿Cómo es el elefante?","grande",["pequeño","rápido","verde"]],["¿Cómo es el azúcar?","dulce",["salado","amargo","duro"]]]),
    B([["En «El perro pequeño ladra», ¿cuál es el adjetivo?","pequeño",["perro","ladra","El"]],["En «La niña alegre canta», ¿cuál es el adjetivo?","alegre",["niña","canta","La"]],["En «Tengo un lápiz azul», ¿cuál es el adjetivo?","azul",["lápiz","Tengo","un"]],["En «El sol caliente brilla», ¿cuál es el adjetivo?","caliente",["sol","brilla","El"]],["En «Mi abuela es muy simpática», ¿cuál es el adjetivo?","simpática",["abuela","es","muy"]]]),
    B([["Completa: La casa es ___.","blanca",["blanco","blancos","blancas"]],["Completa: Los perros son ___.","juguetones",["juguetón","juguetona","juguetonas"]],["Completa: Las flores son ___.","bonitas",["bonito","bonita","bonitos"]],["Completa: El coche es ___.","rojo",["roja","rojas","rojos"]],["¿Qué grupo está bien escrito?","las sillas nuevas",["las sillas nuevo","las silla nuevas","los sillas nuevas"]],["¿Qué grupo está bien escrito?","un gato negro",["un gato negra","una gato negro","un gatos negro"]]])]},
{id:"l06",t:2,n:"Sinónimos y antónimos",e:"↔️",g:"l-sin",learn:["Los sinónimos significan lo mismo o casi lo mismo: contento y alegre.","Los antónimos significan lo contrario: alto y bajo.","Usar sinónimos nos ayuda a no repetir palabras al escribir.","Ejemplo: «empezar» y «comenzar» son sinónimos; «abrir» y «cerrar», antónimos."],
 L:[B([["El contrario de «alto» es…","bajo",["grande","largo","gordo"]],["El contrario de «día» es…","noche",["sol","tarde","luna"]],["El contrario de «frío» es…","caliente",["helado","tibio","fresco"]],["El contrario de «subir» es…","bajar",["saltar","correr","andar"]],["El contrario de «feliz» es…","triste",["alegre","rápido","grande"]],["El contrario de «abrir» es…","cerrar",["romper","mirar","pintar"]]]),
    B([["Un sinónimo de «contento» es…","alegre",["triste","enfadado","cansado"]],["Un sinónimo de «bonito» es…","precioso",["feo","pequeño","viejo"]],["Un sinónimo de «empezar» es…","comenzar",["terminar","parar","acabar"]],["Un sinónimo de «rápido» es…","veloz",["lento","pesado","tranquilo"]],["Un sinónimo de «casa» es…","hogar",["jardín","calle","puerta"]],["Un sinónimo de «hablar» es…","conversar",["callar","escuchar","dormir"]]]),
    B([["El contrario de «valiente» es…","miedoso",["fuerte","atrevido","grande"]],["El contrario de «ancho» es…","estrecho",["largo","alto","gordo"]],["Un sinónimo de «enorme» es…","gigante",["diminuto","corto","fino"]],["«Encender» y «apagar» son…","antónimos",["sinónimos","iguales","nombres"]],["«Cara» y «rostro» son…","sinónimos",["antónimos","adjetivos","contrarios"]],["El contrario de «llenar» es…","vaciar",["cargar","completar","sumar"]]])]},
{id:"l07",t:2,n:"El verbo: presente, pasado y futuro",e:"🏃",g:"l-ver",learn:["Los verbos son palabras que expresan acciones: correr, leer, comer.","El presente es lo que pasa ahora: «Hoy juego».","El pasado es lo que ya pasó: «Ayer jugué».","El futuro es lo que pasará: «Mañana jugaré»."],
 L:[B([["¿Qué palabra es una acción (verbo)?","saltar",["mesa","rojo","grande"]],["¿Qué palabra es una acción (verbo)?","comer",["plato","rico","pan"]],["¿Qué palabra es una acción (verbo)?","dibujar",["lápiz","bonito","papel"]],["¿Qué palabra es una acción (verbo)?","nadar",["piscina","agua","azul"]],["En «Ana lee un cuento», ¿cuál es el verbo?","lee",["Ana","cuento","un"]],["En «Los pájaros vuelan», ¿cuál es el verbo?","vuelan",["pájaros","Los","alto"]]]),
    B([["«Ayer jugué en el parque»: el verbo está en…","pasado",["presente","futuro","ninguno"]],["«Mañana iré al cine»: el verbo está en…","futuro",["pasado","presente","ninguno"]],["«Ahora como fruta»: el verbo está en…","presente",["pasado","futuro","ninguno"]],["«El lunes pasado llovió»: el verbo está en…","pasado",["futuro","presente","ninguno"]],["«Hoy canto en el coro»: el verbo está en…","presente",["pasado","futuro","ninguno"]],["«El verano que viene viajaremos»: el verbo está en…","futuro",["pasado","presente","ninguno"]]]),
    B([["Completa: Mañana yo ___ al parque.","iré",["fui","voy","iba"]],["Completa: Ayer nosotros ___ una tarta.","comimos",["comemos","comeremos","comer"]],["Completa: Ahora mi hermano ___ la guitarra.","toca",["tocó","tocará","tocar"]],["Completa: El año pasado ___ en la playa.","estuve",["estoy","estaré","estar"]],["Completa: La semana que viene ___ el examen.","tendremos",["tuvimos","tenemos","tener"]],["Completa: Ayer Lola ___ un dibujo.","pintó",["pinta","pintará","pintar"]]])]},
{id:"l08",t:2,n:"Ortografía: c/qu, g/gu, r/rr y m antes de p y b",e:"✏️",g:"l-ort",learn:["Con a, o, u escribimos c: casa, cosa, cuna. Con e, i escribimos qu: queso, quince.","Con a, o, u escribimos g: gato, goma. Con e, i (sonido suave) escribimos gu: guerra, guitarra.","Entre vocales, el sonido fuerte se escribe rr: perro. Al principio de palabra, una sola r: ratón.","Antes de p y b siempre se escribe m: campo, hombre."],
 L:[B([["¿Cuál está bien escrita?","queso",["keso","qeso","cueso"]],["¿Cuál está bien escrita?","casa",["kasa","qasa","kassa"]],["¿Cuál está bien escrita?","quince",["kince","cince","qince"]],["¿Cuál está bien escrita?","cuna",["quna","kuna","qüna"]],["¿Cuál está bien escrita?","paquete",["pacete","paqete","pakete"]],["¿Cuál está bien escrita?","cuchara",["quchara","kuchara","cuxara"]]]),
    B([["¿Cuál está bien escrita?","guitarra",["gitarra","guitara","jitarra"]],["¿Cuál está bien escrita?","juguete",["jugete","juguette","huguete"]],["¿Cuál está bien escrita?","gato",["guato","jato","gatto"]],["¿Cuál está bien escrita?","hoguera",["hogera","oguera","hojera"]],["¿Cuál está bien escrita?","gusano",["guusano","jusano","gusanno"]],["¿Cuál está bien escrita?","guerra",["gerra","guera","jerra"]]]),
    B([["¿Cuál está bien escrita?","perro",["pero (el animal)","perrro","pperro"]],["¿Cuál está bien escrita?","ratón",["rratón","raton","ratónn"]],["¿Cuál está bien escrita?","campo",["canpo","cambo","campó"]],["¿Cuál está bien escrita?","hombre",["honbre","ombre","hombrre"]],["¿Cuál está bien escrita?","carretera",["caretera","carreterra","carrettera"]],["¿Cuál está bien escrita?","tambor",["tanbor","tambrr","tamvor"]]])]},
{id:"l09",t:3,n:"Comprensión lectora",e:"📖",g:"l-lec",learn:["Lee despacio y fíjate en quién aparece, dónde y qué pasa.","Si no entiendes una palabra, lee la frase entera para descubrir qué significa.","Algunas respuestas no están escritas: hay que pensarlas con lo que sabes.","Puedes volver a leer el texto todas las veces que quieras."],
 L:[rdq([["Leo tiene un perro blanco. Se llama Nube.",[["¿Cómo se llama el perro?","Nube",["Leo","Toby","Luna"]],["¿De qué color es el perro?","blanco",["negro","marrón","gris"]]]],["Hoy hace sol. Marta va a la playa con su papá.",[["¿Qué tiempo hace?","hace sol",["llueve","nieva","hace viento"]],["¿Con quién va Marta?","con su papá",["con su mamá","sola","con su abuela"]]]],["La rana salta al río. Allí come moscas.",[["¿Dónde salta la rana?","al río",["al árbol","a la casa","al mar"]],["¿Qué come la rana?","moscas",["pan","hierba","peces"]]]],["Mi abuela hace una tarta de fresa. ¡Huele muy bien!",[["¿Quién hace la tarta?","la abuela",["mamá","el abuelo","yo"]],["¿De qué es la tarta?","de fresa",["de chocolate","de limón","de manzana"]]]]]),
    rdq([["Lucía tiene una bicicleta azul con una cesta. Los sábados va al mercado con su padre y trae fruta en la cesta. Le encantan las fresas.",[["¿Cuándo va Lucía al mercado?","los sábados",["los lunes","todos los días","en verano"]],["¿Dónde lleva la fruta?","en la cesta",["en una mochila","en el coche","en las manos"]]]],["El búho Óscar duerme de día en el hueco de un árbol. Cuando se pone el sol, abre sus grandes ojos y sale a buscar ratones.",[["¿Dónde duerme Óscar?","en el hueco de un árbol",["en una cueva","en un nido de paja","en el río"]],["¿Cuándo sale a buscar comida?","cuando se pone el sol",["por la mañana","a mediodía","nunca"]]]],["En el colegio de Pau hay un huerto. Los de segundo han plantado tomates y lechugas. Todos los días riegan las plantas por la mañana.",[["¿Qué han plantado?","tomates y lechugas",["patatas","fresas","flores"]],["¿Cuándo riegan?","por la mañana",["por la noche","los domingos","nunca"]]]],["Mateo ha perdido su gorra en el parque. La busca debajo del tobogán y detrás de los columpios. Al final la encuentra su perro Rufo.",[["¿Qué ha perdido Mateo?","su gorra",["su pelota","su perro","su mochila"]],["¿Quién encuentra la gorra?","su perro Rufo",["Mateo","su madre","un niño"]]]]]),
    rdq([["Pablo se puso el abrigo, la bufanda y los guantes. Al salir, vio que todo el jardín estaba blanco.",[["¿Qué tiempo hacía probablemente?","había nevado",["hacía mucho calor","había un arcoíris","era verano"]],["¿Por qué se puso los guantes?","porque hacía frío",["porque iba a nadar","porque estaba enfermo","para pintar"]]]],["Ana miró la hucha vacía y luego miró el regalo de su madre. Sonrió: había valido la pena ahorrar todo el año.",[["¿En qué gastó Ana su dinero?","en un regalo para su madre",["en caramelos","en un juguete para ella","no lo gastó"]],["¿Cómo se sentía Ana?","contenta",["triste","enfadada","asustada"]]]],["Cuando sonó el timbre, todos los niños salieron corriendo al patio con sus bocadillos.",[["¿Qué momento del día es?","la hora del recreo",["la hora de dormir","la cena","la noche"]],["¿Dónde están los niños?","en el colegio",["en casa","en la playa","en el cine"]]]],["El cartero dejó un paquete con un lazo rojo. En la tarjeta ponía: «¡Feliz cumpleaños, Hugo!».",[["¿Qué celebra Hugo?","su cumpleaños",["la Navidad","el fin de curso","una boda"]],["¿Qué trae el cartero?","un paquete de regalo",["una pizza","una carta del cole","flores"]]]]])]},
{id:"l10",t:3,n:"La oración",e:"💬",g:"l-fra",learn:["Una oración es un grupo de palabras ordenadas que tiene sentido.","Empieza con mayúscula y termina con punto.","Si preguntamos, usamos ¿ ? Si expresamos alegría o sorpresa, usamos ¡ !","Ejemplos: «Hoy hace sol.» «¿Vienes al parque?» «¡Qué bien!»"],
 L:[B([["¿Qué frase está bien ordenada?","El gato bebe leche.",["Leche el bebe gato.","Bebe gato el leche.","Gato leche el bebe."]],["¿Qué frase está bien ordenada?","Mi madre lee un libro.",["Libro un lee madre mi.","Lee mi libro un madre.","Un madre mi lee libro."]],["¿Qué frase está bien ordenada?","Los niños juegan al fútbol.",["Fútbol los al juegan niños.","Juegan niños los al fútbol.","Al niños fútbol juegan los."]],["¿Qué frase está bien ordenada?","Hoy vamos a la playa.",["Playa hoy la a vamos.","Vamos la hoy a playa.","A hoy playa vamos la."]]]),
    B([["¿Qué frase está bien escrita?","Mi hermana se llama Ana.",["mi hermana se llama Ana.","Mi hermana se llama ana","mi hermana se llama ana"]],["¿Qué frase está bien escrita?","El perro corre por el parque.",["el perro corre por el parque.","El perro corre por el parque","el Perro corre por el parque"]],["¿Con qué empieza una oración?","con mayúscula",["con minúscula","con una coma","con un punto"]],["¿Con qué termina una oración que afirma algo?","con un punto",["con una coma","con mayúscula","con un guion"]]]),
    B([["«¿Cómo te llamas?» es una oración que…","pregunta",["exclama","afirma","niega"]],["«¡Qué bonito!» es una oración que…","expresa alegría o sorpresa",["pregunta","niega","da una orden"]],["«No me gusta el brócoli.» es una oración que…","niega",["pregunta","exclama","afirma"]],["¿Qué signos van en «___Dónde vives___»?","¿ ?",["¡ !","« »",". ."]],["¿Qué signos van en «___Qué susto___»?","¡ !",["¿ ?","« »",", ,"]],["«Hoy hace frío.» es una oración que…","afirma",["pregunta","niega","exclama"]]])]},
{id:"l11",t:3,n:"Escribimos textos cortos",e:"📝",g:"l-red",learn:["Antes de escribir, piensa qué quieres contar y a quién.","Un cuento tiene inicio, nudo (lo que pasa) y final.","Para ordenar usamos: primero, después, luego, al final.","Una carta empieza con un saludo («Querida abuela:») y termina con una despedida y tu nombre."],
 L:[B([["¿Cuál es un buen título para un texto sobre tu perro?","Mi perro Rufo",["La nevera","El lunes","Las sumas"]],["¿Cuál es un buen título para un texto sobre la playa?","Un día en la playa",["Mi lápiz","La nieve","Los números"]],["¿Con qué palabras empieza muchas veces un cuento?","Había una vez",["Al final","Fin","Un beso"]],["¿Qué palabra usamos para contar lo último que pasa?","Al final",["Primero","Había una vez","Querida"]]]),
    B([["Completa: «Me levanto. ___ desayuno.»","Después",["Había una vez","Fin","Querido"]],["Para plantar una semilla, ¿qué haces primero?","hacer un agujero en la tierra",["regar la planta","ver crecer la flor","recoger los frutos"]],["¿Qué frase describe mejor a un gato?","Es pequeño, suave y tiene bigotes.",["Corre.","Gato.","Es de color."]],["¿Qué palabra sobra? «El gato gato duerme en el sofá.»","gato",["el","duerme","sofá"]]]),
    B([["Para escribir una carta, ¿cómo empiezas?","Querida abuela:",["Fin.","Colorín colorado.","Un beso."]],["¿Cómo se termina una carta?","Un beso, Ana.",["Había una vez","Querida Ana:","Primero"]],["¿Qué NO puede faltar en una invitación de cumpleaños?","el día y la hora",["el color del sofá","el nombre del perro","la talla de zapatos"]],["En un cuento, ¿qué parte presenta a los personajes?","el inicio",["el final","el título","el dibujo"]],["¿Qué frase está mejor escrita para una postal?","¡Hola! Estoy en la playa y me lo paso genial.",["hola playa genial","Playa. Genial. Yo.","estoy playa me lo paso"]]])]}];

{id:"e01",t:1,n:"El cuerpo humano: órganos y aparatos",e:"🫀",g:"e-cue",learn:["Por fuera vemos la cabeza, el tronco y las extremidades (brazos y piernas).","Por dentro tenemos órganos: el corazón bombea la sangre, los pulmones respiran, el estómago digiere y el cerebro piensa.","Los huesos nos sostienen y los músculos nos permiten movernos.","Los órganos trabajan juntos en aparatos: digestivo, respiratorio, circulatorio y locomotor."],
 L:[B([["¿Con qué parte del cuerpo vemos?","👁️ los ojos",["👂 las orejas","👃 la nariz","✋ las manos"]],["¿Con qué parte caminamos?","🦶 los pies",["✋ las manos","👂 las orejas","👄 la boca"]],["¿Con qué parte comemos?","👄 la boca",["👃 la nariz","👁️ los ojos","🦶 los pies"]],["¿Dónde está la cabeza?","arriba del cuerpo",["en los pies","en la mano","en la rodilla"]],["Los brazos y las piernas son las…","extremidades",["orejas","uñas","pestañas"]]]),
    B([["¿Qué órgano bombea la sangre?","el corazón",["el estómago","el pulmón","el cerebro"]],["¿Con qué órganos respiramos?","con los pulmones",["con el estómago","con el corazón","con los huesos"]],["¿Dónde se digiere la comida?","en el estómago",["en los pulmones","en el corazón","en el cerebro"]],["¿Qué órgano nos permite pensar?","el cerebro",["el corazón","el estómago","el hígado"]],["¿Qué nos sostiene por dentro?","los huesos",["la piel","el pelo","las uñas"]],["¿Qué nos permite mover los huesos?","los músculos",["las uñas","el pelo","los dientes"]]]),
    B([["El estómago forma parte del aparato…","digestivo",["respiratorio","circulatorio","locomotor"]],["Los pulmones forman parte del aparato…","respiratorio",["digestivo","circulatorio","locomotor"]],["El corazón y la sangre forman parte del aparato…","circulatorio",["digestivo","respiratorio","locomotor"]],["Los huesos y los músculos forman el aparato…","locomotor",["digestivo","respiratorio","circulatorio"]],["¿Qué gas tomamos del aire al respirar?","oxígeno",["humo","vapor","nada"]],["¿Qué hueso protege el cerebro?","el cráneo",["la rodilla","el codo","la costilla"]]])]},
{id:"e02",t:1,n:"Los sentidos y la salud",e:"👃",g:"e-cue",learn:["Tenemos cinco sentidos: vista, oído, olfato, gusto y tacto.","Cada sentido tiene su órgano: ojos, oídos, nariz, lengua y piel.","Para estar sanos: comer variado, beber agua, hacer ejercicio, dormir bien y lavarnos.","Comemos más fruta, verdura y legumbres, y menos dulces y bollería."],
 L:[B([["¿Con qué sentido oímos?","el oído",["la vista","el gusto","el tacto"]],["¿Con qué olemos?","👃 la nariz",["👂 la oreja","👅 la lengua","✋ la mano"]],["¿Con qué saboreamos?","👅 la lengua",["👃 la nariz","👁️ los ojos","👂 la oreja"]],["¿Con qué sentimos si algo es suave?","✋ la piel (tacto)",["👁️ la vista","👂 el oído","👃 el olfato"]],["¿Cuántos sentidos tenemos?","5",["3","4","7"]]]),
    B([["¿Qué hábito es saludable?","lavarse los dientes después de comer",["comer chucherías a diario","no dormir","no lavarse las manos"]],["¿Cuántas horas debe dormir un niño?","unas 10 horas",["2 horas","5 horas","20 horas"]],["¿Qué hacemos antes de comer?","lavarnos las manos",["jugar con tierra","ver la tele","nada"]],["¿Qué es mejor beber cuando tenemos sed?","agua",["refresco","zumo con azúcar","nada"]],["¿Qué es bueno para el cuerpo?","hacer deporte",["estar siempre sentado","no desayunar","comer mucha bollería"]]]),
    B([["¿Qué alimentos debemos comer poco?","dulces y bollería",["frutas","verduras","agua"]],["¿Qué alimento nos da huesos fuertes?","la leche",["los caramelos","las patatas fritas","el refresco"]],["¿Cuántas piezas de fruta y verdura conviene comer al día?","unas cinco",["ninguna","una al mes","veinte"]],["La comida más importante para empezar el día es…","el desayuno",["la merienda","la cena","la cena tardía"]],["Las lentejas y los garbanzos son…","legumbres",["frutas","dulces","lácteos"]],["El yogur y el queso son…","lácteos",["legumbres","frutas","verduras"]]])]},
{id:"e03",t:1,n:"Los animales: vertebrados e invertebrados",e:"🐌",g:"e-ani",learn:["Los animales vertebrados tienen esqueleto con columna vertebral: perro, pez, pájaro.","Los invertebrados no tienen huesos: caracol, araña, mariposa, gusano.","Según lo que comen, los animales son herbívoros (plantas), carnívoros (carne) u omnívoros (de todo).","Los insectos tienen 6 patas y las arañas, 8."],
 L:[B([["¿Qué come un herbívoro?","plantas",["carne","piedras","plástico"]],["¿Qué animal es herbívoro?","🐄 la vaca",["🦁 el león","🐺 el lobo","🦈 el tiburón"]],["¿Qué animal es carnívoro?","🦁 el león",["🐄 la vaca","🐑 la oveja","🐰 el conejo"]],["¿Qué come el conejo?","🥕 zanahorias",["🍖 carne","🐟 peces","🪨 piedras"]],["Un animal que come de todo es…","omnívoro",["herbívoro","carnívoro","vegetal"]]]),
    B([["¿Qué animal es vertebrado?","🐶 el perro",["🐌 el caracol","🕷️ la araña","🦋 la mariposa"]],["¿Qué animal es invertebrado?","🐌 el caracol",["🐟 el pez","🐦 el pájaro","🐸 la rana"]],["Un animal vertebrado tiene…","huesos y columna vertebral",["concha siempre","8 patas","solo plumas"]],["¿Qué animal es invertebrado?","🐝 la abeja",["🐴 el caballo","🐍 la serpiente","🦆 el pato"]],["¿Qué animal es vertebrado?","🐢 la tortuga",["🐛 el gusano","🐙 el pulpo","🐞 la mariquita"]]]),
    B([["¿Cuántas patas tiene un insecto?","6",["8","4","10"]],["¿Cuántas patas tiene una araña?","8",["6","4","2"]],["¿Cuál es un insecto?","🐜 la hormiga",["🕷️ la araña","🐌 el caracol","🐛 la lombriz"]],["El caracol y el pulpo son…","moluscos",["insectos","peces","aves"]],["La mariposa antes de ser mariposa es…","una oruga",["un huevo de gallina","un pez","una rana"]],["¿Qué invertebrado fabrica miel?","la abeja",["la hormiga","la araña","la mosca"]]])]},
{id:"e04",t:1,n:"Mamíferos, aves, peces, reptiles y anfibios",e:"🦎",g:"e-ani",learn:["Mamíferos: tienen pelo, nacen del vientre de su madre y toman leche (perro, vaca, delfín).","Aves: tienen plumas, pico y nacen de huevos (gallina, águila).","Peces: viven en el agua, tienen escamas y respiran por branquias.","Reptiles: tienen escamas y se arrastran o tienen patas cortas (lagarto, serpiente). Anfibios: viven en el agua y en la tierra (rana)."],
 L:[B([["¿Cuál es un ave?","🦅 el águila",["🐶 el perro","🐟 el pez","🐍 la serpiente"]],["¿Cuál es un pez?","🐟 la sardina",["🐬 el delfín","🦆 el pato","🐸 la rana"]],["¿Cuál es un mamífero?","🐄 la vaca",["🐔 la gallina","🐍 la serpiente","🐟 el atún"]],["¿Cuál es un reptil?","🦎 el lagarto",["🐸 la rana","🐦 el gorrión","🐱 el gato"]],["¿Cuál es un anfibio?","🐸 la rana",["🐊 el cocodrilo","🐟 el pez","🐶 el perro"]]]),
    B([["¿Qué animales tienen plumas?","las aves",["los peces","los mamíferos","los reptiles"]],["¿Qué animales tienen pelo y toman leche de pequeños?","los mamíferos",["las aves","los peces","los anfibios"]],["¿Qué tiene el cuerpo de un pez?","escamas y aletas",["plumas","pelo","alas"]],["¿Qué tienen las aves en la boca?","pico",["dientes grandes","trompa","bigotes"]],["El delfín vive en el mar, pero es un…","mamífero",["pez","ave","reptil"]]]),
    B([["Los animales que nacen de huevos se llaman…","ovíparos",["vivíparos","mamíferos","herbívoros"]],["Los animales que nacen del vientre de su madre se llaman…","vivíparos",["ovíparos","peces","aves"]],["¿Por dónde respiran los peces?","por las branquias",["por los pulmones","por las aletas","por la cola"]],["¿Qué animal es ovíparo?","🐢 la tortuga",["🐄 la vaca","🐶 el perro","🐬 el delfín"]],["¿Qué animal es vivíparo?","🐱 el gato",["🐔 la gallina","🐍 la serpiente","🐟 el pez"]],["El murciélago vuela, pero es un…","mamífero",["ave","insecto","reptil"]]])]},
{id:"e05",t:2,n:"Los ecosistemas",e:"🌳",g:"e-eco",learn:["Un ecosistema es un lugar con seres vivos (plantas, animales) y seres no vivos (agua, rocas, aire).","Hay ecosistemas de tierra (bosque, pradera, desierto) y de agua (río, mar, lago).","Los seres vivos de un ecosistema se relacionan: unos se comen a otros.","Debemos cuidar los ecosistemas: no tirar basura y respetar plantas y animales."],
 L:[B([["¿Dónde vive el pez?","🌊 en el agua",["🌵 en el desierto","🌳 en el árbol","🏔️ en la nieve"]],["¿Dónde vive el camello?","🌵 en el desierto",["🌊 en el mar","❄️ en el polo","🌳 en el bosque"]],["¿Dónde vive el oso polar?","❄️ en el polo",["🌵 en el desierto","🌴 en la selva","🏖️ en la playa"]],["¿Dónde vive la ardilla?","🌳 en el bosque",["🌊 en el mar","🌵 en el desierto","🏙️ en la nube"]],["¿Dónde vive el mono?","🌴 en la selva",["❄️ en el polo","🌊 en el mar","🌵 en el desierto"]]]),
    B([["¿Qué es un ecosistema?","seres vivos y el lugar donde viven",["solo las plantas","una ciudad","un tipo de juego"]],["¿Cuál es un ecosistema de agua?","el río",["el bosque","el desierto","la pradera"]],["¿Cuál es un ser vivo?","el árbol",["la piedra","el agua","el aire"]],["¿Cuál es un ser no vivo?","la roca",["la hormiga","la flor","el pájaro"]],["¿Cuál es un ecosistema de tierra?","el bosque",["el mar","el lago","el río"]]]),
    B([["En «hierba → conejo → zorro», ¿quién se come al conejo?","el zorro",["la hierba","nadie","el conejo"]],["En «hierba → conejo → zorro», ¿qué come el conejo?","hierba",["zorros","piedras","peces"]],["Las plantas fabrican su alimento con…","la luz del sol, agua y aire",["carne","piedras","plástico"]],["¿Qué daña los ecosistemas?","tirar basura y la contaminación",["plantar árboles","reciclar","ahorrar agua"]],["¿Cómo cuidamos el bosque?","no haciendo fuego ni tirando basura",["arrancando flores","haciendo ruido","cazando"]]])]},
{id:"e06",t:2,n:"Los materiales y sus propiedades",e:"🧱",g:"e-mat",learn:["Los objetos están hechos de materiales: madera, metal, plástico, vidrio, tela, papel…","Algunos materiales son naturales (madera, lana, piedra) y otros artificiales, fabricados por las personas (plástico, vidrio).","Propiedades: duro o blando, transparente u opaco, flexible o rígido.","Reciclamos: amarillo (plástico y latas), azul (papel y cartón), verde (vidrio)."],
 L:[B([["¿De qué material es normalmente una mesa?","🪵 madera",["🥛 vidrio","🧶 lana","🧴 plástico blando"]],["¿De qué material es un vaso que se ve a través?","vidrio",["madera","lana","piedra"]],["¿De qué está hecho un libro?","papel",["metal","vidrio","piedra"]],["¿De qué material es una cuchara?","metal",["papel","lana","cartón"]],["¿De qué está hecha una bufanda de abrigo?","lana",["vidrio","piedra","metal"]]]),
    B([["¿Qué material es transparente?","el vidrio",["la madera","el metal","la piedra"]],["¿Qué material es flexible?","la goma",["la piedra","el vidrio","el ladrillo"]],["¿Qué material es duro?","la piedra",["el algodón","la lana","la esponja"]],["¿Qué material es blando?","el algodón",["el hierro","la piedra","el vidrio"]],["Un material que no deja pasar la luz es…","opaco",["transparente","líquido","brillante"]]]),
    B([["¿Qué material es natural?","la lana",["el plástico","el vidrio","el cristal"]],["¿De dónde sale la madera?","de los árboles",["de las ovejas","del petróleo","de la arena"]],["¿De dónde sale la lana?","de las ovejas",["de los árboles","de las piedras","del mar"]],["¿En qué contenedor tiramos una botella de plástico?","en el amarillo",["en el azul","en el verde","en el marrón"]],["¿En qué contenedor tiramos el papel y el cartón?","en el azul",["en el amarillo","en el verde","en el gris"]],["¿En qué contenedor tiramos un tarro de vidrio?","en el verde",["en el azul","en el amarillo","en el marrón"]]])]},
{id:"e07",t:2,n:"El paisaje",e:"🏞️",g:"e-pai",learn:["El paisaje es lo que vemos a nuestro alrededor.","El paisaje de montaña tiene montes, valles y ríos. El de costa tiene playas, acantilados y mar.","El paisaje de llanura es un terreno llano, sin montañas.","Un paisaje natural no está cambiado por las personas; uno humanizado tiene casas, carreteras o campos de cultivo."],
 L:[B([["Un paisaje con mar y playa es de…","🏖️ costa",["🏔️ montaña","🌾 llanura","🏜️ desierto"]],["Un paisaje con montes muy altos es de…","🏔️ montaña",["🏖️ costa","🌾 llanura","🌊 mar"]],["Un paisaje llano, sin montañas, es una…","🌾 llanura",["🏔️ montaña","🏖️ playa","🌋 volcán"]],["¿Dónde hay arena y olas?","en la playa",["en la montaña","en el bosque","en la ciudad"]]]),
    B([["El terreno bajo entre dos montañas se llama…","valle",["playa","cima","cabo"]],["La parte más alta de una montaña es la…","cima",["falda","orilla","playa"]],["El agua que baja de las montañas hasta el mar forma un…","río",["lago","desierto","valle"]],["Una roca alta junto al mar se llama…","acantilado",["valle","llanura","prado"]],["Una tierra rodeada de agua es una…","isla",["montaña","llanura","valle"]]]),
    B([["Un paisaje con casas, carreteras y campos es…","humanizado",["natural","salvaje","vacío"]],["Un bosque sin construcciones es un paisaje…","natural",["humanizado","urbano","industrial"]],["¿Qué elemento ha puesto el ser humano en el paisaje?","una carretera",["un río","una montaña","una nube"]],["¿Qué podemos hacer para cuidar el paisaje?","no tirar basura en el campo",["hacer fuego en el bosque","arrancar plantas","pintar las rocas"]],["¿Qué paisaje tiene la ciudad de València cerca del mar?","de costa",["de alta montaña","de desierto","de polo"]]])]},
{id:"e08",t:3,n:"Pueblos y ciudades",e:"🏘️",g:"e-pue",learn:["En los pueblos vive poca gente y hay más campo; en las ciudades vive mucha gente y hay más edificios.","El ayuntamiento gobierna el pueblo o la ciudad. Lo dirige el alcalde o la alcaldesa.","Los servicios públicos son para todos: colegio, hospital, biblioteca, bomberos, parques.","Por la calle cumplimos las normas: cruzamos por el paso de cebra y con el semáforo en verde."],
 L:[B([["¿Dónde vive más gente?","en una ciudad",["en un pueblo","en una granja","en una cueva"]],["¿Dónde suele haber más campo y animales de granja?","en un pueblo",["en una gran ciudad","en un aeropuerto","en un centro comercial"]],["¿Dónde hay edificios muy altos y mucho tráfico?","en la ciudad",["en el pueblo","en el campo","en la playa"]],["¿Cómo se llama el lugar donde vives?","localidad",["planeta","océano","continente"]]]),
    B([["¿Dónde se gobierna el pueblo o la ciudad?","en el ayuntamiento",["en el hospital","en el colegio","en el mercado"]],["¿Quién dirige el ayuntamiento?","el alcalde o la alcaldesa",["el médico","el maestro","el cartero"]],["¿Dónde nos curan cuando estamos enfermos?","en el hospital o el centro de salud",["en la biblioteca","en el parque","en el cine"]],["¿Dónde pedimos libros prestados?","en la biblioteca",["en la farmacia","en el hospital","en la panadería"]],["¿Quién apaga los incendios?","los bomberos",["los panaderos","los carteros","los pintores"]]]),
    B([["¿Por dónde cruzamos la calle?","por el paso de cebra",["por en medio de la calle","entre los coches","corriendo sin mirar"]],["¿De qué color debe estar el semáforo de peatones para cruzar?","verde",["rojo","amarillo","apagado"]],["En el coche, los niños deben ir…","con el cinturón y en su sillita",["de pie","sin cinturón","en el maletero"]],["¿Qué llevamos al montar en bici?","casco",["gafas de bucear","bufanda","paraguas"]],["Antes de cruzar la calle debemos…","mirar a los dos lados",["cerrar los ojos","correr","mirar el móvil"]]])]},
{id:"e09",t:3,n:"Las profesiones",e:"👩‍🚒",g:"e-pro",learn:["Las profesiones son los trabajos que hacen las personas.","Algunas trabajan en el campo y el mar (agricultor, pescador), otras en fábricas y otras dan servicios (médica, maestro, bombera).","Cada profesión usa sus herramientas: el pintor usa pinceles; la médica, el fonendoscopio.","Todas las profesiones son importantes y las pueden hacer hombres y mujeres."],
 L:[B([["¿Quién cura a los enfermos?","🧑‍⚕️ el médico o la médica",["🧑‍🌾 el agricultor","🧑‍🍳 el cocinero","👮 el policía"]],["¿Quién apaga los fuegos?","🧑‍🚒 los bomberos",["🧑‍🏫 los maestros","🧑‍🍳 los cocineros","🧑‍🎨 los pintores"]],["¿Quién enseña en el colegio?","🧑‍🏫 el maestro o la maestra",["🧑‍🚒 el bombero","🧑‍⚕️ la médica","🧑‍🔧 el mecánico"]],["¿Quién hace el pan?","🧑‍🍳 el panadero",["🧑‍✈️ el piloto","👮 la policía","🧑‍🔬 la científica"]],["¿Quién conduce un avión?","🧑‍✈️ el piloto",["🧑‍🌾 el agricultor","🧑‍🏫 la maestra","🧑‍🍳 el cocinero"]]]),
    B([["¿Qué usa el pintor?","el pincel",["el martillo","la jeringa","la red"]],["¿Qué usa la médica para escuchar el corazón?","el fonendoscopio",["la tiza","la sartén","la pala"]],["¿Qué usa el pescador?","la red",["el pincel","la tiza","la regla"]],["¿Qué usa el carpintero?","el martillo y la sierra",["la red","el horno","la jeringa"]],["¿Qué usa el peluquero?","las tijeras y el peine",["el tractor","la red","el casco de bombero"]]]),
    B([["¿Dónde trabaja un agricultor?","en el campo",["en un hospital","en un avión","en un colegio"]],["¿Dónde trabaja una enfermera?","en el hospital",["en el mar","en el campo","en una mina"]],["¿Dónde trabaja un pescador?","en el mar",["en el desierto","en una oficina","en una biblioteca"]],["Las profesiones…","las pueden hacer hombres y mujeres",["solo las hacen hombres","solo las hacen mujeres","no son importantes"]],["¿Quién reparte las cartas?","el cartero o la cartera",["el bombero","el panadero","la jueza"]]])]},
{id:"e10",t:3,n:"Los medios de transporte",e:"🚌",g:"e-pro",learn:["Los transportes nos llevan de un lugar a otro.","Hay transportes terrestres (coche, autobús, tren), acuáticos (barco) y aéreos (avión, helicóptero).","Los transportes públicos los usa mucha gente a la vez (autobús, metro, tren); los privados son de una persona o familia (coche, bici).","Andar, la bici y el transporte público contaminan menos que el coche."],
 L:[B([["¿Qué transporte va por el aire?","✈️ el avión",["🚗 el coche","🚢 el barco","🚂 el tren"]],["¿Qué transporte va por el agua?","🚢 el barco",["🚌 el autobús","✈️ el avión","🚲 la bici"]],["¿Qué transporte va por las vías?","🚂 el tren",["⛵ el velero","🚁 el helicóptero","🚗 el coche"]],["¿Qué transporte tiene dos ruedas y pedales?","🚲 la bicicleta",["🚌 el autobús","🚂 el tren","🚢 el barco"]]]),
    B([["¿Cuál es un transporte público?","el autobús",["la bicicleta de mi hermana","el coche de mi familia","los patines"]],["¿Cuál es un transporte privado?","el coche de la familia",["el metro","el autobús","el tranvía"]],["El metro va…","por debajo de la tierra",["por el mar","por el aire","por el desierto"]],["¿Cuál es un transporte aéreo?","el helicóptero",["el tranvía","el camión","el submarino"]],["¿Cuál es un transporte terrestre?","el camión",["el avión","el barco","el velero"]]]),
    B([["¿Qué transporte no contamina?","la bicicleta",["el coche","el avión","el camión"]],["¿Por qué es bueno usar el transporte público?","porque contamina menos y hay menos atascos",["porque es más ruidoso","porque gasta más gasolina","no es bueno"]],["En el autobús, ¿cómo nos portamos?","sentados y respetando a los demás",["de pie saltando","gritando","molestando al conductor"]],["Una señal de STOP indica…","que hay que pararse",["que hay que correr","que hay un colegio","que se puede aparcar"]],["¿Qué transporte usarías para ir de València a Mallorca?","el barco o el avión",["la bicicleta","el metro","el tranvía"]]])]}];
