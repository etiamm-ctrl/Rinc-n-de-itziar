h1{font-size:1.7rem;margin:4px 0 10px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.hb span{display:block;font-size:2.4rem}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.track{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .3s}
.qc{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;text-align:center;font-size:1.5rem;font-weight:600;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.spk{border:0;border-radius:50%;width:80px;height:80px;font-size:2.2rem;background:var(--c2);cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 6px;font-size:1.4rem;font-weight:600;cursor:pointer;min-height:62px}
.opt.big{font-size:2.6rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:#fde0dd;border-color:#d9443b;color:#23305a}
.line{min-height:62px;border:3px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;background:var(--card);justify-content:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;font-size:1.4rem;cursor:pointer}
.go{border:0;border-radius:16px;background:var(--c2);color:#fff;font-weight:700;font-size:1.2rem;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.fb{text-align:center;font-weight:700;font-size:1.3rem;min-height:2rem;margin-top:10px}
.fin{text-align:center;padding-top:20px}
.shake{animation:sh .4s}
.pop{position:fixed;font-size:1.8rem;pointer-events:none;animation:fl 1.2s ease-out forwards}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.hb{padding:14px 6px;font-size:1rem}.hb span{font-size:1.9rem}
