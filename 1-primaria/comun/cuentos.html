*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.35}
main{max-width:560px;margin:0 auto;padding:14px 14px 30px}
button{font:inherit;color:inherit}
.btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.on{background:var(--c2);color:#fff;border-color:var(--c2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
[hidden]{display:none!important}

h1{font-size:1.7rem;margin:4px 0 10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;border-radius:20px;padding:18px 10px;font-weight:700;font-size:1.1rem;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.card span{display:block;font-size:2.6rem}
.txt{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px;line-height:1.9;font-weight:600;letter-spacing:.02em;margin:10px 0}
.txt.up{text-transform:uppercase}
.w{cursor:pointer;border-radius:6px;padding:1px 2px}
.w.on{background:#ffd54f;color:#23305a}
.opt{display:block;width:100%;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:14px;font-size:1.2rem;font-weight:600;margin-bottom:10px;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:#fde0dd;border-color:#d9443b;color:#23305a}
.go{border:0;border-radius:16px;background:var(--c2);color:#fff;font-weight:700;font-size:1.2rem;padding:12px 20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.q{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px;font-size:1.4rem;font-weight:600;text-align:center;margin:10px 0}
.q.up{text-transform:uppercase}
.fb{text-align:center;font-weight:700;font-size:1.3rem;min-height:2rem}
.fin{text-align:center;padding-top:20px}
.pop{position:fixed;font-size:1.8rem;pointer-events:none;animation:fl 1.2s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.in{display:block;width:100%;font:inherit;font-size:1.2rem;border:3px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:var(--card);color:var(--ink)}
