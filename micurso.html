 bk("Área de un rectángulo de 5 cm × 4 cm:|20 cm²|9 cm²;18 cm²;20 cm\nEl m.c.d. de 12 y 18 es…|6|3;36;2\nEl m.c.m. de 4 y 6 es…|12|24;2;10\nUn número es divisible entre 3 si…|sus cifras suman múltiplo de 3|acaba en 3;es par;acaba en 0\n2,5 l son… ml|2.500|250;25;25.000"),

{id:"m66",t:3,n:"Estadística y probabilidad",e:"📊",learn:["La media es la suma de los datos dividida entre cuántos son.","La moda es el dato que más se repite. La mediana es el dato central.","Probabilidad: casos favorables ÷ casos posibles.","Seguro, probable, poco probable e imposible."],
 L:[P(function(){var a=R(8)+3;return N("La media de "+(a-2)+", "+a+" y "+(a+2)+" es…",a)},function(){var a=R(5)+3;return Q("Datos: "+a+", "+(a+2)+", "+a+", "+(a+4)+", "+a+". La moda es…",a,[a+2,a+4,a+1])}),
 bk("En un dado, ¿es posible sacar un 7?|imposible|seguro;probable;poco probable\nProbabilidad de sacar cara en una moneda:|1/2|1/4;1;2\nLa moda de 2, 3, 3, 5, 3 es…|3|2;5;16\nLa mediana de 1, 3, 5, 7, 9 es…|5|3;7;25\nEn un dado, probabilidad de sacar 6:|1/6|6/1;1/3;1/2"),
 bk("Para comparar datos usamos…|un gráfico de barras|una rima;un mapa;una poesía\nMedia de 4 y 8:|6|12;4;5\nBolsa con 3 bolas rojas y 1 azul. Es más probable sacar…|roja|azul;igual;ninguna\nProbabilidad de sacar un número par en un dado:|3/6|2/6;1/6;6/3\nLa mayor frecuencia indica la…|moda|media;mediana;suma")]}];

{id:"l61",t:1,n:"La oración: complementos y tipos de predicado",e:"🧩",learn:["Predicado verbal: tiene un verbo de acción (Ana lee). Predicado nominal: con ser, estar o parecer (Ana es alta).","Complemento directo (CD): lo que recibe la acción (Ana lee un libro).","Complemento indirecto (CI): para quién (Ana da un libro a Pedro).","Complemento circunstancial (CC): lugar, tiempo o modo (lee en casa)."],
 L:[B([["En «Ana lee un libro», el CD es…","un libro",["Ana","lee","Ana lee"]],["En «Pedro es alto», el predicado es…","nominal",["verbal","pasivo","ninguno"]],["En «Pedro corre», el predicado es…","verbal",["nominal","pasivo","ninguno"]],["En «Doy un regalo a mi madre», el CI es…","a mi madre",["un regalo","Doy","mi"]],["En «Estudia en casa», «en casa» es un…","CC de lugar",["CD","CI","sujeto"]]]),
 B([["En «Luis compró pan ayer», «ayer» es un…","CC de tiempo",["CD","CI","sujeto"]],["En «Ella canta muy bien», «muy bien» es un…","CC de modo",["CD","CI","CC de lugar"]],["Verbo copulativo:","ser",["correr","comer","saltar"]],["En «Mi perro es negro», «negro» es…","atributo",["CD","CI","CC"]],["¿Qué oración tiene CD?","Come manzanas.",["Es feliz.","Llegó tarde.","Vive allí."]]]),
 B([["¿Qué pregunta ayuda a hallar el CD?","¿Qué?",["¿Cuándo?","¿A quién?","¿Dónde?"]],["¿Qué pregunta ayuda a hallar el CI?","¿A quién?",["¿Qué?","¿Cuándo?","¿Dónde?"]],["En «Regalé flores a Ana», el CI es…","a Ana",["flores","Regalé","ninguno"]],["En «Vivimos en Valencia», el CC es…","en Valencia",["Vivimos","Valencia","ninguno"]],["Una oración con sujeto y verbo copulativo es…","atributiva",["transitiva","impersonal","imperativa"]]])]},
{id:"l62",t:2,n:"Verbos: modos y tiempos",e:"🏃",learn:["Modos: indicativo (hechos), subjuntivo (deseos y dudas) e imperativo (órdenes).","Tiempos simples: presente, pretérito, futuro. Compuestos: he cantado, había cantado.","Formas no personales: infinitivo (cantar), gerundio (cantando) y participio (cantado).","Los verbos irregulares cambian la raíz: poder → puedo, tener → tengo."],
 L:[B([["«Canta» (tú, orden) está en modo…","imperativo",["indicativo","subjuntivo","infinitivo"]],["«Ojalá llueva» está en modo…","subjuntivo",["indicativo","imperativo","infinitivo"]],["«Comimos» está en modo…","indicativo",["subjuntivo","imperativo","gerundio"]],["El gerundio de «cantar» es…","cantando",["cantado","cantar","canté"]],["El participio de «comer» es…","comido",["comiendo","comer","como"]]]),
 B([["«He comido» es un tiempo…","compuesto",["simple","imperativo","infinitivo"]],["«Había leído» es…","pluscuamperfecto",["futuro","presente","imperativo"]],["Pretérito perfecto de «escribir» (yo):","he escrito",["escribí","escribiré","escribo"]],["Participio de «ver»:","visto",["viendo","veído","ver"]],["Gerundio de «correr»:","corriendo",["corrido","correr","corro"]]]),
 B([["Subjuntivo: Quiero que tú ___ (venir).","vengas",["vienes","vendrás","vino"]],["Imperativo: ___ (tú, hacer) los deberes.","haz",["hace","hizo","hagas"]],["Futuro de «poder» (yo):","podré",["puedo","pude","podría"]],["Pretérito de «poner» (él):","puso",["pone","pondrá","ponía"]],["Infinitivo de «tuvieron»:","tener",["tenir","tuver","tuvo"]]])]},
{id:"l63",t:3,n:"Tipos de texto y literatura",e:"📚",learn:["Narración: cuenta hechos (cuentos, novelas). Descripción: cuenta cómo es algo.","Argumentación: defiende una opinión con razones. Exposición: explica un tema.","Géneros literarios: narrativo, lírico (poesía) y dramático (teatro).","Figuras: comparación («rápido como el viento»), metáfora y personificación."],
 L:[B([["Un cuento es un texto…","narrativo",["descriptivo","argumentativo","lírico"]],["Contar cómo es una persona es…","describir",["narrar","argumentar","exponer"]],["Una poesía pertenece al género…","lírico",["narrativo","dramático","periodístico"]],["Una obra de teatro pertenece al género…","dramático",["lírico","narrativo","epistolar"]],["Una novela es un texto…","narrativo",["lírico","dramático","descriptivo"]]]),
 B([["«Rápido como el viento» es una…","comparación",["metáfora","personificación","rima"]],["«La luna sonríe» es una…","personificación",["comparación","rima","metáfora"]],["Un texto que defiende una opinión es…","argumentativo",["narrativo","lírico","descriptivo"]],["Un texto que explica un tema es…","expositivo",["narrativo","lírico","dramático"]],["Un verso es…","una línea de un poema",["un capítulo","una frase de teatro","un párrafo"]]]),
 B([["La rima ocurre cuando coinciden…","los sonidos finales",["las primeras letras","los títulos","las comas"]],["Una estrofa es…","un grupo de versos",["una sílaba","un párrafo","una palabra"]],["El narrador cuenta…","la historia",["el título","el tema","la rima"]],["Las partes de un cuento son…","inicio, nudo y desenlace",["verso y estrofa","sujeto y predicado","título y firma"]],["En un diálogo de teatro, las acotaciones…","indican gestos y escenas",["riman","son el título","son el autor"]]])]},
{id:"l64",t:1,n:"Ortografía y clases de palabras",e:"✏️",learn:["Llevan tilde las agudas acabadas en vocal, n o s (canción) y las llanas que no acaban así (árbol).","Las esdrújulas siempre llevan tilde (música).","Sustantivo (casa), adjetivo (grande), verbo (corre), adverbio (muy) y preposición (de, en).","Prefijos y sufijos: im-posible, pan-adero. Sinónimos significan lo mismo; antónimos, lo contrario."],
 L:[bk("«Canción» es una palabra…|aguda|llana;esdrújula;monosílaba\n«Árbol» es una palabra…|llana|aguda;esdrújula;monosílaba\n«Música» lleva tilde porque es…|esdrújula|aguda;llana;monosílaba\n«Rápido» es un…|adjetivo|sustantivo;verbo;adverbio\n«Casa» es un…|sustantivo|verbo;adjetivo;adverbio"),

{id:"e61",t:1,n:"El cuerpo humano: reproducción y salud",e:"🫀",learn:["La reproducción humana es sexual: óvulo y espermatozoide forman un embrión.","Etapas de la vida: infancia, adolescencia, madurez y vejez.","Salud: alimentación equilibrada, ejercicio, descanso e higiene.","El sistema inmunitario nos defiende de enfermedades; las vacunas ayudan a prevenirlas."],

{id:"e62",t:2,n:"Fuerzas, máquinas y electricidad",e:"⚙️",learn:["Una fuerza puede mover, parar, frenar o deformar un objeto.","El rozamiento frena el movimiento. La gravedad atrae los objetos hacia el suelo.","Máquinas simples: palanca, polea, plano inclinado y rueda.","Circuito en serie y en paralelo; los aislantes no dejan pasar la electricidad."],

 B([["La rueda reduce el…","rozamiento",["peso","tiempo","aire"]],["Las tijeras son una…","palanca doble",["polea","rampa","rueda"]],["En paralelo, si se funde una bombilla…","las demás siguen encendidas",["se apagan todas","se rompe el cable","salta el sol"]],["La energía solar es…","renovable",["no renovable","un gas","un metal"]],["Frotar un globo y pegarlo a la pared es electricidad…","estática",["en serie","en paralelo","solar"]]])]},
{id:"e63",t:3,n:"Historia: de la Prehistoria a la Edad Media",e:"🏛️",learn:["Prehistoria: Paleolítico (cazadores), Neolítico (agricultura) y Edad de los Metales.","La escritura marca el inicio de la Historia (hace unos 5.000 años).","Edad Antigua: Egipto, Grecia y Roma. Roma dominó la península ibérica (Hispania).","Edad Media: del siglo V al XV. Al-Ándalus, reinos cristianos y feudalismo."],

{id:"e64",t:3,n:"España, Europa y la Comunitat Valenciana",e:"🗺️",learn:["España es una monarquía parlamentaria. La Constitución es de 1978.","Poderes: legislativo (Cortes), ejecutivo (Gobierno) y judicial (jueces).","La Comunitat Valenciana tiene tres provincias: Castellón, Valencia y Alicante. Su capital es València.","España pertenece a la Unión Europea y usa el euro."],

{id:"e65",t:1,n:"Aparatos del cuerpo humano",e:"🫁",learn:["Digestivo: boca, esófago, estómago e intestinos; aprovecha los nutrientes.","Respiratorio: nariz, tráquea y pulmones; nos da oxígeno.","Circulatorio: corazón, arterias, venas y sangre; reparte oxígeno y nutrientes.","Excretor: los riñones filtran la sangre. Locomotor: huesos (206 en un adulto) y músculos.","Nervioso: cerebro y nervios; con los sentidos nos relacionamos con el entorno."],
 L:[bk("Los pulmones forman parte del aparato…|respiratorio|digestivo;excretor;locomotor\nEl corazón bombea…|la sangre|el aire;la orina;la comida\nEl estómago pertenece al aparato…|digestivo|respiratorio;circulatorio;nervioso\nHuesos y músculos forman el aparato…|locomotor|excretor;digestivo;respiratorio\nEl cerebro pertenece al sistema…|nervioso|digestivo;circulatorio;excretor"),
 bk("Los nutrientes se absorben sobre todo en el…|intestino delgado|esófago;pulmón;riñón\nLos riñones producen…|orina|bilis;saliva;sangre\nEl aire pasa por la nariz, la tráquea y llega a los…|pulmones|riñones;intestinos;músculos\nLas arterias llevan la sangre…|desde el corazón|hacia el corazón;al estómago;a los pulmones solo\nEl órgano del olfato es la…|nariz|lengua;piel;oreja"),
 bk("La sangre transporta…|oxígeno y nutrientes|solo agua;solo aire;solo orina\nLa digestión empieza en…|la boca|el intestino;el hígado;el riñón\nEl diafragma nos ayuda a…|respirar|digerir;caminar;oír\nLas neuronas son células del sistema…|nervioso|digestivo;excretor;locomotor\nUn adulto tiene unos…|206 huesos|26 huesos;106 huesos;606 huesos")]},
{id:"e66",t:3,n:"Edad Moderna y Contemporánea",e:"⛵",learn:["Edad Moderna (1492–1789): Reyes Católicos, llegada a América, Renacimiento, Carlos I y Felipe II.","Siglo de Oro: Cervantes escribió El Quijote (1605).","Edad Contemporánea (desde 1789): Revolución Francesa, Revolución Industrial y Constitución de 1812, «La Pepa».","Siglo XX: Guerra Civil (1936–1939), dictadura de Franco hasta 1975 y Constitución de 1978."],

{id:"e67",t:2,n:"Seres vivos y ecosistemas",e:"🌿",learn:["Los seres vivos nacen, crecen, se relacionan, se reproducen y mueren.","Las plantas fabrican su alimento con la fotosíntesis: toman CO₂ y luz, y liberan oxígeno.","Herbívoros (plantas), carnívoros (carne) y omnívoros (de todo). Los descomponedores, como hongos y bacterias, descomponen restos.","Un ecosistema son los seres vivos más el medio en el que viven."],
 L:[bk("Las plantas fabrican su alimento mediante la…|fotosíntesis|digestión;respiración solo;circulación\nUn animal que come plantas es…|herbívoro|carnívoro;omnívoro;descomponedor\nUn carnívoro come…|carne|solo plantas;solo hongos;rocas\nUn ser vivo que come plantas y animales es…|omnívoro|herbívoro;carnívoro;productor\nLos hongos forman su propio…|reino|planeta;hueso;aparato"),
 bk("En una cadena alimentaria, las plantas son…|productores|consumidores;descomponedores;depredadores\nLos descomponedores…|degradan la materia muerta|fabrican alimento con luz;cazan presas;dan leche\nUn ecosistema está formado por…|seres vivos y el medio donde viven|solo animales;solo plantas;solo rocas\nLas plantas toman del aire…|dióxido de carbono|solo oxígeno;nitrógeno líquido;humo\nLas plantas liberan…|oxígeno|petróleo;orina;sal"),
