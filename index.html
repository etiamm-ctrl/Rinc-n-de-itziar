la brilló mucho y dibujó una sonrisa para ella.\",\"La luna sonrió y sopló fuerte. La estrella subió volando hasta el cielo y, cada noche, le guiña un ojo a Itziar.\"],q:[[\"¿Quién vio caer la estrella?\",\"Itziar\",[\"su madre\",\"un pirata\",\"el rey\"]],[\"¿Dónde cayó la estrella?\",\"en el jardín\",[\"en el mar\",\"en el colegio\",\"en una cueva\"]],[\"¿Qué quería la estrella?\",\"volver a casa\",[\"comer pizza\",\"dormir\",\"jugar al fútbol\"]]]},\n{t:\"El conill i la lluna\",l:1,e:\"🐰\",k:\"#e8710a\",p:[\"Un conill va mirar el cel. Va vore una lluna gran i blanca.\",\"El conill va pensar: «Vull tocar la lluna!». Va pujar a un turó molt alt.\"],c:\"Des del turó no hi arribava. Què va fer el conill?\",o:[\"Va demanar ajuda a un mussol\",\"Va botar molt fort\"],r:[\"El mussol li va dir: «La lluna és lluny, però mira l’estany». El conill va vore la lluna a l’aigua i la va tocar amb la patica. Que content estava!\",\"El conill va botar i va botar, però va caure a l’estany. Plof! Va vore la lluna a l’aigua i es va riure. Quina nit més divertida!\"],q:[[\"Quin animal és el protagonista?\",\"un conill\",[\"un gos\",\"un gat\",\"un ànec\"]],[\"Què volia tocar el conill?\",\"la lluna\",[\"el sol\",\"una estrela\",\"un núvol\"]],[\"On va vore la lluna al final?\",\"a l’aigua\",[\"en una cova\",\"en un arbre\",\"a casa\"]]]},\n{t:\"Itziar i l’estrela\",l:1,e:\"🌟\",k:\"#e8710a\",p:[\"Una nit, Itziar va vore caure una estrela xicoteta al jardí. L’estrela brillava i semblava tindre fred.\",\"Itziar la va agafar amb cura. «Vull tornar a casa», va dir l’estrela amb veu baixeta.\"],c:\"Itziar volia ajudar-la. Què va fer?\",o:[\"Va fer una escala amb caixes\",\"Va demanar un desig a la lluna\"],r:[\"Va pujar caixa a caixa fins dalt de tot i va llançar l’estrela al cel. L’estrela va brillar molt i li va dibuixar un somriure.\",\"La lluna va somriure i va bufar fort. L’estrela va pujar volant al cel i, cada nit, fa un colp d’ull a Itziar.\"],q:[[\"Qui va vore caure l’estrela?\",\"Itziar\",[\"la seua mare\",\"un pirata\",\"el rei\"]],[\"On va caure l’estrela?\",\"al jardí\",[\"a la mar\",\"a l’escola\",\"en una cova\"]],[\"Què volia l’estrela?\",\"tornar a casa\",[\"menjar pizza\",\"dormir\",\"jugar a futbol\"]]]},\n{t:\"El castell de sorra\",l:1,e:\"🏖️\",k:\"#e8710a\",p:[\"Itziar va anar a la platja amb el seu iaio. Portava un poal roig i una pala.\",\"Va fer un castell de sorra amb quatre torres. Una onada gran va vindre corrent.\"],c:\"L’onada s’acostava al castell. Què va fer Itziar?\",o:[\"Va fer un fossat amb la pala\",\"Va eixir corrent a buscar el iaio\"],r:[\"El fossat va parar l’aigua. El castell es va quedar quasi sec i el seu iaio va aplaudir.\",\"El iaio va vindre amb el poal i entre els dos van salvar el castell. Quin bon equip!\"],q:[[\"Amb qui va anar Itziar a la platja?\",\"amb el seu iaio\",[\"amb la seua mare\",\"sola\",\"amb el gos\"]],[\"Quantes torres tenia el castell?\",\"quatre\",[\"dues\",\"sis\",\"una\"]],[\"De quin color era el poal?\",\"roig\",[\"blau\",\"verd\",\"rosa\"]]]},\n{t:\"El conejo y la luna\",e:\"🐰\",k:\"#5b4bd5\",p:[\"Un conejo miró al cielo. Vio una luna grande y blanca.\",\"El conejo pensó: «¡Quiero tocar la luna!». Subió a una colina muy alta.\"],c:\"Desde la colina no llegaba. ¿Qué hizo el conejo?\",o:[\"Pidió ayuda a un búho\",\"Saltó muy fuerte\"],r:[\"El búho le dijo: «La luna está lejos, pero mira el lago». El conejo vio la luna en el agua y la tocó con su patita. ¡Qué feliz estaba!\",\"El conejo saltó y saltó, pero se cayó al lago. ¡Splash! Vio la luna en el agua y se rió. ¡Qué noche tan divertida!\"],q:[[\"¿Qué animal es el protagonista?\",\"un conejo\",[\"un perro\",\"un gato\",\"un pato\"]],[\"¿Qué quería tocar el conejo?\",\"la luna\",[\"el sol\",\"una estrella\",\"una nube\"]],[\"¿Dónde vio la luna al final?\",\"en el agua\",[\"en una cueva\",\"en un árbol\",\"en su casa\"]]]},\n{t:\"La pequeña semilla\",e:\"🌱\",k:\"#1f9d6b\",p:[\"Una semilla dormía bajo la tierra. Hacía mucho frío.\",\"Un día llegó la lluvia. La semilla bebió agua y sintió ganas de crecer.\"],c:\"Arriba había sol y un caracol. ¿Qué hizo la semilla?\",o:[\"Sacó su tallo hacia el sol\",\"Esperó un poco más\"],r:[\"Creció y creció hasta ser una flor amarilla. Las abejas vinieron a visitarla.\",\"Esperó con paciencia. Cuando llegó la primavera, salió una flor roja muy bonita.\"],q:[[\"¿Dónde dormía la semilla?\",\"bajo la tierra\",[\"en el mar\",\"en una casa\",\"en una caja\"]],[\"¿Qué le trajo la lluvia?\",\"agua\",[\"comida\",\"juguetes\",\"zapatos\"]],[\"¿En qué se convirtió la semilla?\",\"en una flor\",[\"en una piedra\",\"en un pez\",\"en un libro\"]]]},\n{t:\"El dragón miedoso\",e:\"🐉\",k:\"#d9487f\",p:[\"Dino era un dragón verde. Echaba fuego por la boca, pero tenía miedo de la oscuridad.\",\"Una noche se apagó la luz de su cueva. Dino se tapó con la manta.\"],c:\"Oyó un ruidito: tic, tic, tic. ¿Qué hizo Dino?\",o:[\"Miró debajo de la manta\",\"Echó un poquito de fuego\"],r:[\"Era un grillo pequeño. Se hicieron amigos y el grillo cantó una canción hasta que Dino se durmió.\",\"Con la luz del fuego vio un ratoncito. Se hicieron amigos y la oscuridad ya no dio miedo.\"],q:[[\"¿De qué color era Dino?\",\"verde\",[\"rojo\",\"azul\",\"amarillo\"]],[\"¿De qué tenía miedo?\",\"de la oscuridad\",[\"de los perros\",\"del agua\",\"de los helados\"]],[\"¿Qué pasó con la luz de su cueva?\",\"se apagó\",[\"se hizo más grande\",\"se fue volando\",\"cambió de color\"]]]},\n{t:\"El castillo de arena\",e:\"🏖️\",k:\"#0e8f9c\",p:[\"Itziar fue a la playa con su abuelo. Llevaba un cubo rojo y una pala.\",\"Hizo un castillo de arena con cuatro torres. Una ola grande vino corriendo.\"],c:\"La ola se acercaba al castillo. ¿Qué hizo Itziar?\",o:[\"Hizo un foso con la pala\",\"Corrió a buscar a su abuelo\"],r:[\"El foso paró el agua. El castillo se quedó casi seco y su abuelo aplaudió.\",\"Su abuelo vino con el cubo y entre los dos salvaron el castillo. ¡Qué buen equipo!\"],q:[[\"¿Con quién fue Itziar a la playa?\",\"con su abuelo\",[\"con su madre\",\"sola\",\"con su perro\"]],[\"¿Cuántas torres tenía el castillo?\",\"cuatro\",[\"dos\",\"seis\",\"una\"]],[\"¿De qué color era el cubo?\",\"rojo\",[\"azul\",\"verde\",\"rosa\"]]]},\n{t:\"Los tres cerditos\",e:\"🐷\",k:\"#e0689a\",p:[\"Tres cerditos salieron a construir sus casas. Un lobo vivía cerca del bosque.\",\"El primero hizo su casa de paja. El segundo la hizo de madera. El tercero trabajó mucho y la hizo de ladrillos.\"],c:\"El lobo sopló y sopló. ¿Qué hicieron los cerditos pequeños?\",o:[\"Corrieron a la casa de ladrillos\",\"Se quedaron mirando al lobo\"],r:[\"La casa de paja y la de madera se cayeron, pero la de ladrillos no. Los tres cerditos se quedaron juntos y a salvo.\",\"Pero la casa de madera era débil y se cayó. Los cerditos corrieron a la casa de ladrillos y su hermano les abrió la puerta.\"],q:[[\"¿Cuántos cerditos eran?\",\"tres\",[\"dos\",\"cuatro\",\"cinco\"]],[\"¿De qué hizo la casa el primer cerdito?\",\"de paja\",[\"de ladrillos\",\"de madera\",\"de piedra\"]],[\"¿Qué casa no se cayó?\",\"la de ladrillos\",[\"la de paja\",\"la de madera\",\"ninguna se cayó\"]]]},\n{t:\"Cenicienta\",e:\"👠\",k:\"#8e63d9\",p:[\"Cenicienta vivía con su madrastra y sus hermanastras. Ella limpiaba la casa todos los días.\",\"El rey invitó a todos a un baile. Un hada le regaló un vestido, una carroza y unos zapatos de cristal, pero la magia acababa a las doce.\"],c:\"El baile era precioso, pero sonaron las doce campanadas. ¿Qué hizo Cenicienta?\",o:[\"Salió corriendo y perdió un zapato\",\"Se despidió del príncipe con calma\"],r:[\"El príncipe encontró el zapato de cristal y buscó por todo el reino a su dueña. Al probárselo a Cenicienta, le quedó perfecto. ¡Y fueron muy felices!\",\"Le prometió al príncipe volver a verlo. Él encontró su casa, le entregó un zapato de cristal y fueron muy felices.\"],q:[[\"¿Con quién vivía Cenicienta?\",\"con su madrastra\",[\"con un dragón\",\"con el rey\",\"sola\"]],[\"¿Qué le regaló el hada?\",\"un vestido y una carroza\",[\"un perro\",\"una casa\",\"un libro\"]],[\"¿De qué eran los zapatos?\",\"de cristal\",[\"de madera\",\"de oro\",\"de lana\"]]]},\n{t:\"Pinocho\",e:\"🪵\",k:\"#c47a2c\",p:[\"Gepetto era un carpintero que hizo un muñeco de madera. Lo llamó Pinocho y, por arte de magia, el muñeco cobró vida.\",\"Pinocho tenía que ir a la escuela, pero un zorro y un gato lo invitaron a ir al circo.\"],c:\"Pinocho dudó un momento. ¿Qué hizo?\",o:[\"Fue a la escuela\",\"Se fue con el zorro\"],r:[\"Aprendió a leer y a escribir, y Gepetto se puso muy contento. Pinocho se portó tan bien que el hada lo convirtió en un niño de verdad.\",\"Dijo una mentira y su nariz creció y creció. Se dio cuenta de su error, volvió con Gepetto y, por ser sincero, se convirtió en un niño de verdad.\"],q:[[\"¿Quién hizo a Pinocho?\",\"Gepetto\",[\"el zorro\",\"el rey\",\"el hada\"]],[\"¿De qué era Pinocho?\",\"de madera\",[\"de papel\",\"de lana\",\"de piedra\"]],[\"¿Qué pasó al final?\",\"se hizo un niño de verdad\",[\"se fue al circo para siempre\",\"se convirtió en pájaro\",\"se quedó de madera\"]]]},\n{t:\"Caperucita Roja\",e:\"🧺\",k:\"#d9443b\",p:[\"Caperucita Roja iba a casa de su abuelita con una cesta de pan y miel. Su madre le dijo: «No hables con extraños».\",\"En el bosque se encontró con un lobo. «¿Adónde vas?», le preguntó el lobo con voz suave.\"],c:\"Caperucita se acordó de lo que le dijo su madre. ¿Qué hizo?\",o:[\"Siguió su camino sin hablar\",\"Le dijo que era un secreto\"],r:[\"Corrió hasta la casa de su abuelita y le contó todo. Un leñador espantó al lobo, y los tres comieron pan con miel.\",\"Dijo: «Es un secreto». El lobo se rió y se fue. Caperucita llegó a casa de su abuela y merendaron pan con miel muy contentas.\"],q:[[\"¿De qué color era la capa de Caperucita?\",\"roja\",[\"azul\",\"verde\",\"amarilla\"]],[\"¿Qué llevaba en la cesta?\",\"pan y miel\",[\"pizza\",\"fruta\",\"juguetes\"]],[\"¿Qué le dijo su madre?\",\"que no hablara con extraños\",[\"que se quedara en casa\",\"que comprara leche\",\"que corriera mucho\"]]]},\n{t:\"Ricitos de Oro\",e:\"🐻\",k:\"#b5651d\",p:[\"Ricitos de Oro encontró una casita en el bosque. Dentro había tres tazones de sopa, tres sillas y tres camas.\",\"Era la casa de tres osos. El tazón grande estaba muy caliente. El mediano estaba muy frío. El pequeño estaba perfecto.\"],c:\"Ricitos estaba muy cansada. ¿Qué hizo?\",o:[\"Probó la cama pequeña\",\"Se fue a su casa\"],r:[\"Se quedó dormida. Los osos llegaron y ella se despertó, pidió perdón y los osos la perdonaron. Después tomaron la sopa todos juntos.\",\"Antes de irse, dejó una nota: «Perdón por entrar». Los osos la leyeron y sonrieron.\"],q:[[\"¿Cuántos osos vivían en la casa?\",\"tres\",[\"dos\",\"cuatro\",\"uno\"]],[\"¿Cómo estaba el tazón pequeño?\",\"perfecto\",[\"muy caliente\",\"muy frío\",\"vacío\"]],[\"¿Cómo se llamaba la niña?\",\"Ricitos de Oro\",[\"Caperucita\",\"Cenicienta\",\"Blancanieves\"]]]},\n{t:\"El patito feo\",e:\"🦢\",k:\"#1e88e5\",p:[\"Un patito nació más grande y gris que sus hermanos. Todos le decían: «¡Qué feo eres!».\",\"El patito se sintió muy triste y se fue lejos. Pasó el invierno solo, con mucho frío.\"],c:\"En primavera vio unos cisnes blancos en el lago. ¿Qué hizo el patito?\",o:[\"Se acercó a ellos\",\"Se escondió entre las plantas\"],r:[\"Se miró en el agua y vio que ya era un cisne blanco y precioso. Los cisnes lo recibieron como a un amigo.\",\"Los cisnes lo vieron y lo invitaron a nadar. En el agua se miró y descubrió que también era un cisne hermoso.\"],q:[[\"¿De qué color era el patito?\",\"gris\",[\"rosa\",\"negro\",\"verde\"]],[\"¿Cómo se sintió el patito?\",\"triste\",[\"enfadado\",\"dormido\",\"contento\"]],[\"¿En qué animal se convirtió?\",\"en un cisne\",[\"en una rana\",\"en una gallina\",\"en un pez\"]]]},\n{t:\"Leo, el leoncito valiente\",e:\"🦁\",k:\"#c77700\",p:[\"Leo era un leoncito pequeño que vivía en la sabana. Sus papás eran grandes y fuertes, y Leo quería ser igual.\",\"Un día, Leo vio un río muy ancho. Al otro lado había una fruta dulce y madura que quería probar.\"],c:\"El río corría rápido. ¿Qué hizo Leo?\",o:[\"Buscó un puente de piedras\",\"Pidió ayuda a su amiga la jirafa\"],r:[\"Saltó de piedra en piedra con mucho cuidado. Llegó al otro lado, comió la fruta y volvió contento: ser valiente también es ser prudente.\",\"La jirafa estiró su largo cuello y lo ayudó a cruzar. Comieron la fruta juntos, y Leo aprendió que pedir ayuda también es de valientes.\"],q:[[\"¿Qué animal es Leo?\",\"un león\",[\"un tigre\",\"un oso\",\"un perro\"]],[\"¿Qué quería probar?\",\"una fruta\",[\"un helado\",\"un pez\",\"una galleta\"]],[\"¿Dónde estaba la fruta?\",\"al otro lado del río\",[\"en un árbol\",\"en su casa\",\"en la montaña\"]]]}\n];\nvar up=false,fs=1.6,rate=.6,si=0,pg=0,res=-1,qi=0,sc=0,AC=null;\nfunction beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}\nfunction say(t,cb,hl){if(!window.speechSynthesis){if(cb)cb();return}try{speechSynthesis.cancel();var x=new SpeechSynthesisUtterance(t);var L=ST[si]&&ST[si].l?\"ca-ES\":\"es-ES\";x.lang=L;x.rate=rate;var v=speechSynthesis.getVoices().filter(function(a){return a.lang.toLowerCase().indexOf(L.slice(0,2))===0})[0];if(v)x.voice=v;if(hl)x.onboundary=function(e){hl(e.charIndex)};x.onend=x.onerror=function(){if(cb)cb()};speechSynthesis.speak(x)}catch(e){}}\nfunction stop(){try{speechSynthesis.cancel()}catch(e){}$(\"play\").textContent=\"▶️ Escuchar\";hl(-1)}\nfunction hl(ci){Array.prototype.forEach.call(document.querySelectorAll(\".w\"),function(w){w.classList.toggle(\"on\",ci>=0&&+w.dataset.a<=ci&&ci<+w.dataset.b)})}\nfunction show(id){[\"list\",\"read\",\"quiz\",\"fin\"].forEach(function(s){$(s).hidden=s!==id})}\nfunction mk(t){var b=docum
