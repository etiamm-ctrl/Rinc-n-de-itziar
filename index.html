<div class=\"row\"><button class=\"btn\" id=\"mcb\">⬅️ Cuentos<\/button><\/div><h1>✏️ Mi cuento<\/h1><p style=\"color:var(--sub)\">Escribe nombres y creo un cuento con ellos.<\/p><input class=\"in\" id=\"m1\" maxlength=\"20\" placeholder=\"Tu mascota (o un animal)\"><input class=\"in\" id=\"m2\" maxlength=\"20\" placeholder=\"Un amigo o una amiga\"><input class=\"in\" id=\"m3\" maxlength=\"20\" placeholder=\"Un familiar (Mamá, Abuelo...)\"><button class=\"go\" id=\"mgo\" style=\"margin-top:12px\">📖 Crear mi cuento<\/button><\/section>\n<section id=\"read\" hidden>\n<div class=\"row\"><button class=\"btn\" id=\"bk\">⬅️ Cuentos<\/button><b id=\"ttl\"><\/b><\/div>\n<div class=\"row\"><button class=\"btn\" id=\"cs\">Aa mayús/minús<\/button><button class=\"btn\" id=\"fm\">A−<\/button><button class=\"btn\" id=\"fp\">A+<\/button><button class=\"btn\" id=\"sp\">🐢 Lento<\/button><\/div>\n<div class=\"txt\" id=\"txt\"><\/div><div id=\"ch\"><\/div>\n<div class=\"row\" style=\"justify-content:space-between\"><button class=\"btn\" id=\"prev\">◀️<\/button><button class=\"go\" id=\"play\">▶️ Escuchar<\/button><button class=\"btn\" id=\"next\">▶️<\/button><\/div>\n<div class=\"row\" style=\"justify-content:center\"><b id=\"pgn\"><\/b><\/div>\n<div class=\"row\" style=\"justify-content:center\"><button class=\"go\" id=\"qz\" hidden style=\"background:#1f9d6b\">❓ Preguntas del cuento<\/button><\/div>\n<p style=\"color:var(--sub);text-align:center;margin:6px 0\">Toca una palabra para oírla.<\/p>\n<\/section>\n<section id=\"quiz\" hidden>\n<div class=\"row\"><b id=\"qn\"><\/b><b id=\"qs\" style=\"margin-left:auto\"><\/b><\/div>\n<div class=\"q\" id=\"qq\"><\/div><button class=\"btn\" id=\"qsay\">🔊 Escuchar la pregunta<\/button>\n<div id=\"qo\" style=\"margin-top:12px\"><\/div><div class=\"fb\" id=\"fb\"><\/div>\n<\/section>\n<section id=\"fin\" class=\"fin\" hidden><div style=\"font-size:2.6rem\" id=\"fs\"><\/div><h1 id=\"ft\"><\/h1><p id=\"fm2\" style=\"color:var(--sub)\"><\/p><button class=\"go\" id=\"again\">Leer otro cuento<\/button><\/section>\n<\/main><script>\nvar $=function(i){return document.getElementById(i)},R=function(n){return Math.floor(Math.random()*n)},shuf=function(a){return a.map(function(x){return[Math.random(),x]}).sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]})};\nvar ST=[\n{t:\"Itziar y la estrella\",e:\"⭐\",k:\"#5b4bd5\",p:[\"Una noche, Itziar vio caer una estrella pequeña en su jardín. La estrella brillaba y parecía tener frío.\",\"Itziar la cogió con cuidado. «Quiero volver a casa», dijo la estrella con voz bajita.\"],c:\"Itziar quería ayudarla. ¿Qué hizo?\",o:[\"Hizo una escalera con cajas\",\"Pidió un deseo a la luna\"],r:[\"Subió caja a caja hasta lo más alto y lanzó la estrella al cielo. La estrella brilló mucho y dibujó una sonrisa para ella.\",\"La luna sonrió y sopló fuerte. La estrella subió volando hasta el cielo y, cada noche, le guiña un ojo a Itziar.\"],q:[[\"¿Quién vio caer la estrella?\",\"Itziar\",[\"su madre\",\"un pirata\",\"el rey\"]],[\"¿Dónde cayó la estrella?\",\"en el jardín\",[\"en el mar\",\"en el colegio\",\"en una cueva\"]],[\"¿Qué quería la estrella?\",\"volver a casa\",[\"comer pizza\",\"dormir\",\"jugar al fútbol\"]]]},\n{t:\"Itziar y el día gris\",e:\"🌧️\",k:\"#5b4bd5\",p:[\"Un día, Itziar se despertó triste. Fuera llovía y su amiga no podía venir.\",\"Su abuela le dijo: «Las nubes también se cansan y descansan».\"],c:\"Itziar quería sentirse mejor. ¿Qué hizo?\",o:[\"Dibujó un arcoíris\",\"Llamó a su amiga por teléfono\"],r:[\"Pintó un arcoíris enorme y lo pegó en la ventana. Cuando salió el sol, vio uno de verdad y sonrió.\",\"Hablaron y se rieron mucho. Quedaron para jugar al día siguiente y el día gris se volvió amarillo.\"],q:[[\"¿Cómo se despertó Itziar?\",\"triste\",[\"contenta\",\"enfadada\",\"dormida\"]],[\"¿Qué tiempo hacía?\",\"llovía\",[\"nevaba\",\"hacía calor\",\"había niebla\"]],[\"¿Quién le habló de las nubes?\",\"su abuela\",[\"su padre\",\"su amiga\",\"un pájaro\"]]]},\n{t:\"La paella de l’iaia\",l:1,e:\"🥘\",k:\"#e8710a\",p:[\"Diumenge, Itziar va anar a casa de l’iaia. L’iaia anava a fer una paella gran per a tota la família.\",\"Itziar va ajudar a posar l’arròs i les verdures. Quin bon olor!\"],c:\"L’iaia va dir: «Ara falta una cosa». Què va demanar?\",o:[\"Un poc de safrà\",\"Una rodanxa de llima\"],r:[\"Itziar va tirar el safrà i l’arròs es va posar groc. Van menjar tots junts i van repetir!\",\"Van espremer la llima sobre l’arròs. Estava boníssim, i tots van repetir!\"],q:[[\"Quin dia va anar Itziar a casa de l’iaia?\",\"diumenge\",[\"dilluns\",\"dimecres\",\"divendres\"]],[\"Per a qui era la paella?\",\"per a tota la família\",[\"per a un veí\",\"només per a Itziar\",\"per al gos\"]],[\"Què va ajudar a posar Itziar?\",\"l’arròs i les verdures\",[\"els plats\",\"el pa\",\"el gelat\"]]]},\n{t:\"Itziar i les Falles\",l:1,e:\"🎆\",k:\"#e8710a\",p:[\"A València és març i hi ha Falles. Itziar va vore un ninot enorme al carrer.\",\"El ninot era un drac de colors. A la nit, tots els veïns van eixir a vore’l.\"],c:\"Va sonar la música. Què va fer Itziar?\",o:[\"Va ballar amb la banda\",\"Va mirar de lluny amb el seu pare\"],r:[\"Va ballar i va riure amb tots els xiquets. Va ser la nit més divertida!\",\"Va mirar de lluny i va vore com el drac brillava. Quina nit més bonica!\"],q:[[\"En quin mes hi ha les Falles?\",\"març\",[\"juliol\",\"octubre\",\"gener\"]],[\"Quin ninot va vore Itziar?\",\"un drac\",[\"un gat\",\"un ós\",\"un cotxe\"]],[\"Per què van eixir els veïns?\",\"per a vore el ninot\",[\"per a anar a escola\",\"per a dormir\",\"per a nadar\"]]]},\n{t:\"El conill i la lluna\",l:1,e:\"🐰\",k:\"#e8710a\",p:[\"Un conill va mirar el cel. Va vore una lluna gran i blanca.\",\"El conill va pensar: «Vull tocar la lluna!». Va pujar a un turó molt alt.\"],c:\"Des del turó no hi arribava. Què va fer el conill?\",o:[\"Va demanar ajuda a un mussol\",\"Va botar molt fort\"],r:[\"El mussol li va dir: «La lluna és lluny, però mira l’estany». El conill va vore la lluna a l’aigua i la va tocar amb la patica. Que content estava!\",\"El conill va botar i va botar, però va caure a l’estany. Plof! Va vore la lluna a l’aigua i es va riure. Quina nit més divertida!\"],q:[[\"Quin animal és el protagonista?\",\"un conill\",[\"un gos\",\"un gat\",\"un ànec\"]],[\"Què volia tocar el conill?\",\"la lluna\",[\"el sol\",\"una estrela\",\"un núvol\"]],[\"On va vore la lluna al final?\",\"a l’aigua\",[\"en una cova\",\"en un arbre\",\"a casa\"]]]},\n{t:\"Itziar i l’estrela\",l:1,e:\"🌟\",k:\"#e8710a\",p:[\"Una nit, Itziar va vore caure una estrela xicoteta al jardí. L’estrela brillava i semblava tindre fred.\",\"Itziar la va agafar amb cura. «Vull tornar a casa», va dir l’estrela amb veu baixeta.\"],c:\"Itziar volia ajudar-la. Què va fer?\",o:[\"Va fer una escala amb caixes\",\"Va demanar un desig a la lluna\"],r:[\"Va pujar caixa a caixa fins dalt de tot i va llançar l’estrela al cel. L’estrela va brillar molt i li va dibuixar un somriure.\",\"La lluna va somriure i va bufar fort. L’estrela va pujar volant al cel i, cada nit, fa un colp d’ull a Itziar.\"],q:[[\"Qui va vore caure l’estrela?\",\"Itziar\",[\"la seua mare\",\"un pirata\",\"el rei\"]],[\"On va caure l’estrela?\",\"al jardí\",[\"a la mar\",\"a l’escola\",\"en una cova\"]],[\"Què volia l’estrela?\",\"tornar a casa\",[\"menjar pizza\",\"dormir\",\"jugar a futbol\"]]]},\n{t:\"El castell de sorra\",l:1,e:\"🏖️\",k:\"#e8710a\",p:[\"Itziar va anar a la platja amb el seu iaio. Portava un poal roig i una pala.\",\"Va fer un castell de sorra amb quatre torres. Una onada gran va vindre corrent.\"],c:\"L’onada s’acostava al castell. Què va fer Itziar?\",o:[\"Va fer un fossat amb la pala\",\"Va eixir corrent a buscar el iaio\"],r:[\"El fossat va parar l’aigua. El castell es va quedar quasi sec i el seu iaio va aplaudir.\",\"El iaio va vindre amb el poal i entre els dos van salvar el castell. Quin bon equip!\"],q:[[\"Amb qui va anar Itziar a la platja?\",\"amb el seu iaio\",[\"amb la seua mare\",\"sola\",\"amb el gos\"]],[\"Quantes torres tenia el castell?\",\"quatre\",[\"dues\",\"sis\",\"una\"]],[\"De quin color era el poal?\",\"roig\",[\"blau\",\"verd\",\"rosa\"]]]},\n{t:\"El conejo y la luna\",e:\"🐰\",k:\"#5b4bd5\",p:[\"Un conejo miró al cielo. Vio una luna grande y blanca.\",\"El conejo pensó: «¡Quiero tocar la luna!». Subió a una colina muy alta.\"],c:\"Desde la colina no llegaba. ¿Qué hizo el conejo?\",o:[\"Pidió ayuda a un búho\",\"Saltó muy fuerte\"],r:[\"El búho le dijo: «La luna está lejos, pero mira el lago». El conejo vio la luna en el agua y la tocó con su patita. ¡Qué feliz estaba!\",\"El conejo saltó y saltó, pero se cayó al lago. ¡Splash! Vio la luna en el agua y se rió. ¡Qué noche tan divertida!\"],q:[[\"¿Qué animal es el protagonista?\",\"un conejo\",[\"un perro\",\"un gato\",\"un pato\"]],[\"¿Qué quería tocar el conejo?\",\"la luna\",[\"el sol\",\"una estrella\",\"una nube\"]],[\"¿Dónde vio la luna al final?\",\"en el agua\",[\"en una cueva\",\"en un árbol\",\"en su casa\"]]]},\n{t:\"La pequeña semilla\",e:\"🌱\",k:\"#1f9d6b\",p:[\"Una semilla dormía bajo la tierra. Hacía mucho frío.\",\"Un día llegó la lluvia. La semilla bebió agua y sintió ganas de crecer.\"],c:\"Arriba había sol y un caracol. ¿Qué hizo la semilla?\",o:[\"Sacó su tallo hacia el sol\",\"Esperó un poco más\"],r:[\"Creció y creció hasta ser una flor amarilla. Las abejas vinieron a visitarla.\",\"Esperó con paciencia. Cuando llegó la primavera, salió una flor roja muy bonita.\"],q:[[\"¿Dónde dormía la semilla?\",\"bajo la tierra\",[\"en el mar\",\"en una casa\",\"en una caja\"]],[\"¿Qué le trajo la lluvia?\",\"agua\",[\"comida\",\"juguetes\",\"zapatos\"]],[\"¿En qué se convirtió la semilla?\",\"en una flor\",[\"en una piedra\",\"en un pez\",\"en un libro\"]]]},\n{t:\"El dragón miedoso\",e:\"🐉\",k:\"#d9487f\",p:[\"Dino era un dragón verde. Echaba fuego por la boca, pero tenía miedo de la oscuridad.\",\"Una noche se apagó la luz de su cueva. Dino se tapó con la manta.\"],c:\"Oyó un ruidito: tic, tic, tic. ¿Qué hizo Dino?\",o:[\"Miró debajo de la manta\",\"Echó un poquito de fuego\"],r:[\"Era un grillo pequeño. Se hicieron amigos y el grillo cantó una canción hasta que Dino se durmió.\",\"Con la luz del fuego vio un ratoncito. Se hicieron amigos y la oscuridad ya no dio miedo.\"],q:[[\"¿De qué color era Dino?\",\"verde\",[\"rojo\",\"azul\",\"amarillo\"]],[\"¿De qué tenía miedo?\",\"de la oscuridad\",[\"de los perros\",\"del agua\",\"de los helados\"]],[\"¿Qué pasó con la luz de su cueva?\",\"se apagó\",[\"se hizo más grande\",\"se fue volando\",\"cambió de color\"]]]},\n{t:\"El castillo de arena\",e:\"🏖️\",k:\"#0e8f9c\",p:[\"Itziar fue a la playa con su abuelo. Llevaba un cubo rojo y una pala.\",\"Hizo un castillo de arena con cuatro torres. Una ola grande vino corriendo.\"],c:\"La ola se acercaba al castillo. ¿Qué hizo Itziar?\",o:[\"Hizo un foso con la pala\",\"Corrió a buscar a su abuelo\"],r:[\"El foso paró el agua. El castillo se quedó casi seco y su abuelo aplaudió.\",\"Su abuelo vino con el cubo y entre los dos salvaron el castillo. ¡Qué buen equipo!\"],q:[[\"¿Con quién fue Itziar a la playa?\",\"con su abuelo\",[\"con su madre\",\"sola\",\"con su perro\"]],[\"¿Cuántas torres tenía el castillo?\",\"cuatro\",[\"dos\",\"seis\",\"una\"]],[\"¿De qué color era el cubo?\",\"rojo\",[\"azul\",\"verde\",\"rosa\"]]]},\n{t:\"Los tres cerditos\",e:\"🐷\",k:\"#e0689a\",p:[\"Tres cerditos salieron a construir sus casas. Un lobo vivía cerca del bosque.\",\"El primero hizo su casa de paja. El segundo la hizo de madera. El tercero trabajó mucho y la hizo de ladrillos.\"],c:\"El lobo sopló y sopló. ¿Qué hicieron los cerditos pequeños?\",o:[\"Corrieron a la casa de ladrillos\",\"Se quedaron mirando al lobo\"],r:[\"La casa de paja y la de madera se cayeron, pero la de ladrillos no. Los tres cerditos se quedaron juntos y a salvo.\",\"Pero la casa de madera era débil y se cayó. Los cerditos corrieron a la casa de ladrillos y su hermano les abrió la puerta.\"],q:[[\"¿Cuántos cerditos eran?\",\"tres\",[\"dos\",\"cuatro\",\"cinco\"]],[\"¿De qué hizo la casa el primer cerdito?\",\"de paja\",[\"de ladrillos\",\"de madera\",\"de piedra\"]],[\"¿Qué casa no se cayó?\",\"la de ladrillos\",[\"la de paja\",\"la de madera\",\"ninguna se cayó\"]]]},\n{t:\"Cenicienta\",e:\"👠\",k:\"#8e63d9\",p:[\"Cenicienta vivía con su madrastra y sus hermanastras. Ella limpiaba la casa todos los días.\",\"El rey invitó a todos a un baile. Un hada le regaló un vestido, una carroza y unos zapatos de cristal, pero la magia acababa a las doce.\"],c:\"El baile era precioso, pero sonaron las doce campanadas. ¿Qué hizo Cenicienta?\",o:[\"Salió corriendo y perdió un zapato\",\"Se despidió del príncipe con calma\"],r:[\"El príncipe encontró el zapato de cristal y buscó por todo el reino a su dueña. Al probárselo a Cenicienta, le quedó perfecto. ¡Y fueron muy felices!\",\"Le prometió al príncipe volver a verlo. Él encontró su casa, le entregó un zapato de cristal y fueron muy felices.\"],q:[[\"¿Con quién vivía Cenicienta?\",\"con su madrastra\",[\"con un dragón\",\"con el rey\",\"sola\"]],[\"¿Qué le regaló el hada?\",\"un vestido y una carroza\",[\"un perro\",\"una casa\",\"un libro\"]],[\"¿De qué eran los zapatos?\",\"de cristal\",[\"de madera\",\"de oro\",\"de lana\"]]]},\n{t:\"Pinocho\",e:\"🪵\",k:\"#c47a2c\",p:[\"Gepetto era un carpintero que hizo un muñeco de madera. Lo llamó Pinocho y, por arte de magia, el muñeco cobró vida.\",\"Pinocho tenía que ir a la escuela, pero un zorro y un gato lo invitaron a ir al circo.\"],c:\"Pinocho dudó un momento. ¿Qué hizo?\",o:[\"Fue a la escuela\",\"Se fue con el zorro\"],r:[\"Aprendió a leer y a escribir, y Gepetto se puso muy contento. Pinocho se portó tan bien que el hada lo convirtió en un niño de verdad.\",\"Dijo una mentira y su nariz creció y creció. Se dio cuenta de su error, volvió con Gepetto y, por ser sincero, se convirtió en un niño de verdad.\"],q:[[\"¿Quién hizo a Pinocho?\",\"Gepetto\",[\"el zorro\",\"el rey\",\"el hada\"]],[\"¿De qué era Pinocho?\",\"de madera\",[\"de papel\",\"de lana\",\"de piedra\"]],[\"¿Qué pasó al final?\",\"se hizo un niño de verdad\",[\"se fue al circo para siempre\",\"se convirtió en pájaro\",\"se quedó de madera\"]]]},\n{t:\"Caperucita Roja\",e:\"🧺\",k:\"#d9443b\",p:[\"Caperucita Roja iba a casa de su abuelita con una cesta de pan y miel. Su madre le dijo: «No hables con extraños».\",\"En el bosque se encontró con un lobo. «¿Adónde vas?», le preguntó el lobo con voz suave.\"],c:\"Caperucita se acordó de lo que le dijo su madre. ¿Qué hizo?\",o:[\"Siguió su camino sin hablar\",\"Le dijo que era un secreto\"],r:[\"Corrió hasta la casa de su abuelita y le contó todo. Un leñador espantó al lobo, y los tres comieron pan con miel.\",\"Dijo: «Es un secreto». El lobo se rió y se fue. Caperucita llegó a casa de su abuela y merendaron pan con miel muy contentas.\"],q:[[\"¿De qué color era la capa de Caperucita?\",\"roja\",[\"azul\",\"verde\",\"amarilla\"]],[\"¿Qué llevaba en la cesta?\",\"pan y miel\",[\"pizza\",\"fruta\",\"juguetes\"]],[\"¿Qué le dijo su madre?\",\"que no hablara con extraños\",[\"que se quedara en casa\",\"que comprara leche\",\"que corriera mucho\"]]]},\n{t:\"Ricitos de Oro\",e:\"🐻\",k:\"#b5651d\",p:[\"Ricitos de Oro encontró una casita en el bosque. Dentro había tres tazones de sopa, tres sillas y tres camas.\",\"Era la casa de tres osos. El tazón grande estaba muy caliente. El mediano estaba muy frío. El pequeño estaba perfecto.\"],c:\"Ricitos estaba muy cansada. ¿Qué hizo?\",o:[\"Probó la cama pequeña\",\"Se fue a su casa\"],r:[\"Se quedó dormida. Los osos llegaron y ella se despertó, pidió perdón y los osos la perdonaron. Después tomaron la sopa todos juntos.\",\"Antes de irse, dejó una nota: «Perdón por entrar». Los osos la leyeron y sonrieron.\"],q:[[\"¿Cuántos osos vivían en la casa?\",\"tres\",[\"dos\",\"cuatro\",\"uno\"]],[\"¿Cómo estaba el tazón pequeño?\",\"perfecto\",[\"muy c function weekData(){var d=LS("dias",{}),t=LS("tiempo",{}),rows=[],now=new Date(),A=0,T=0,M=0,days=0,i;for(i=6;i>=0;i--){var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),k=dkey(dt),x=d[k]||{a:0,t:0},m=Math.round((t[k]||0)/60);rows.push({n:["dom","lun","mar","mié","jue","vie","sáb"][dt.getDay()]+" "+dt.getDate(),a:x.a,t:x.t,m:m});A+=x.a;T+=x.t;M+=m;if(x.t>0||m>0)days++}return{rows:rows,A:A,T:T,M:M,days:days}}
function topics(){var o=allStats();return Object.keys(o).filter(function(k){return o[k].t>=5}).map(function(k){return[k,Math.round(o[k].a*100/o[k].t)]}).sort(function(a,b){return a[1]-b[1]})}

 s+=weak.length?"Para practicar: "+weak.map(nm).join(", ")+"\n":"Para practicar: nada destacable\n";if(strong.length)s+="Se le da muy bien: "+strong.map(nm).join(", ")+"\n";return s}
function weekHtml(){var w=weekData(),h="<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center'><div class='sub' style='display:block'><b style='font-size:1.4rem'>"+w.days+"/7</b><br><small>días</small></div><div class='sub' style='display:block'><b style='font-size:1.4rem'>"+(w.T?Math.round(w.A*100/w.T):0)+"%</b><br><small>aciertos</small></div><div class='sub' style='display:block'><b style='font-size:1.4rem'>"+w.M+"</b><br><small>minutos</small></div></div>";
 h+="<table style='width:100%;border-collapse:collapse;margin-top:8px'>"+w.rows.map(function(r){return "<tr style='border-bottom:1px solid var(--line)'><td style='padding:5px 2px'>"+r.n+"</td><td>"+r.t+" resp.</td><td>"+(r.t?Math.round(r.a*100/r.t):0)+"%</td><td>"+r.m+" min</td></tr>"}).join("")+"</table>";
 h+="<h3 style='margin:12px 0 4px'>Qué practicar</h3>";var t=topics().filter(function(x){return x[1]<75}).slice(0,3);h+=t.length?"<ul style='margin:0;padding-left:20px'>"+t.map(function(x){return "<li>"+(STN[x[0]]||x[0])+": "+x[1]+"% de aciertos</li>"}).join("")+"</ul>":"<p style='color:var(--sub);margin:0'>Todavía no hay temas flojos.</p>";
 h+="<textarea id='rt' readonly rows='6' style='width:100%;margin-top:10px;font:inherit;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)'>"+reportText()+"</textarea><button class='chg' id='rcp' style='width:100%;margin-top:6px'>📋 Copiar informe</button>";return h}
function bars(s){var ks=Object.keys(s).filter(function(k){return k!=="_r"});if(!ks.length)return "<p style='color:var(--sub)'>Sin datos todavía.</p>";ks.sort(function(a,b){return s[a].a/s[a].t-s[b].a/s[b].t});return ks.map(function(k){var x=s[k],p=Math.round(x.a*100/x.t);return "<div style='margin:8px 0'><b>"+(STN[k]||k)+"</b> · "+x.a+" de "+x.t+" ("+p+"%)<div style='height:10px;background:var(--line);border-radius:6px;overflow:hidden'><div style='height:100%;width:"+p+"%;background:"+(p<60?"#d9443b":"#1f9d6b")+"'></div></div></div>"}).join("")}
function lvlHtml(){var h="<p style='color:var(--sub);margin:0 0 8px'>Ordenado de menos a más aciertos: lo primero es lo que más le cuesta.</p>",any=false;for(var n=0;n<=5;n++){var s=LS("stats"+n,{});if(Object.keys(s).filter(function(k){return k!=="_r"}).length){any=true;h+="<h3 style='margin:12px 0 4px'>📁 "+lab(n)+"</h3>"+bars(s)}}
